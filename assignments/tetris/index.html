<script>
'use strict';
// ================= constants =================
const W = 256, H = 224, CELL = 8, COLS = 10, ROWS = 20;

const LOCK_MS = 500, CLEAR_MS = 360, DEMO_IDLE_MS = 10000, DEMO_LEN_MS = 45000;

const STAGE_COUNT = 20;
let TEST = new URLSearchParams(location.search).has('test');  // test mode (T on title toggles): K = instant stage clear

// SRS wall kicks (x right, y up)
const KICKS = {

const KICKS_I = {

  '1>2': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]],   '2>1': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],
  '2>3': [[0,0],[2,0],[-1,0],[2,1],[-1,-2]],   '3>2': [[0,0],[-2,0],[1,0],[-2,-1],[1,2]],
  '3>0': [[0,0],[1,0],[-2,0],[1,-2],[-2,1]],   '0>3': [[0,0],[-1,0],[2,0],[-1,2],[2,-1]]
};
// NES-style gravity: frames per row at 60fps
const GRAVITY = [48,43,38,33,28,23,18,13,8,6,5,5,5,4,4,4,3,3,3,2,2,2,2,2,2,2,2,2,2,1];
const BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

// ================= sound =================
// Songs: melody tokens are NOTE:length in steps (eighth notes), one bass root per bar.
// KOROBEINIKI and KALINKA (Larionov, 1860) are public-domain Russian songs arranged here;
// the other four are original compositions.
const SONGS = [
  {
    name: 'KOROBEINIKI', bpm: 150, bar: 8, style: 'oct', drum: 'khshkhsh', leads: ['p25', 'p25', 'p50'], p2: 'echo',
    parts: [
      ['E5:2 B4:1 C5:1 D5:2 C5:1 B4:1 A4:2 A4:1 C5:1 E5:2 D5:1 C5:1 B4:3 C5:1 D5:2 E5:2 C5:2 A4:2 A4:2 R:2 ' +
       'R:1 D5:2 F5:1 A5:2 G5:1 F5:1 E5:3 C5:1 E5:2 D5:1 C5:1 B4:2 B4:1 C5:1 D5:2 E5:2 C5:2 A4:2 A4:2 R:2',
       'E2 A2 G#2 A2 D2 C2 G#2 A2'],
      ['E5:2 B4:1 C5:1 D5:2 C5:1 B4:1 A4:2 A4:1 C5:1 E5:2 D5:1 C5:1 B4:3 C5:1 D5:2 E5:2 C5:2 A4:2 A4:2 R:2 ' +
       'R:1 D5:2 F5:1 A5:2 G5:1 F5:1 E5:3 C5:1 E5:2 D5:1 C5:1 B4:2 B4:1 C5:1 D5:2 E5:2 C5:2 A4:2 A4:2 R:2',
       'E2 A2 G#2 A2 D2 C2 G#2 A2'],
      ['E5:4 C5:4 D5:4 B4:4 C5:4 A4:4 G#4:4 B4:4 E5:4 C5:4 D5:4 B4:4 C5:2 E5:2 A5:4 G#5:8',
       'A2 E2 A2 E2 A2 E2 A2 E2']
    ]
  },
  {
    // chorus "Kalinka, kalinka, kalinka moya..." then an octave-up repeat; speeds up every loop
    name: 'KALINKA', bpm: 140, bar: 8, style: 'gallop', drum: 'khshkhsh', leads: ['p25', 'p50'], p2: 'echo', accel: true,
    parts: [
      ['C5:1 B4:1 A4:2 B4:1 A4:1 G4:2 A4:1 G4:1 F4:1 E4:1 E4:4 ' +
       'E4:1 A4:1 A4:1 B4:1 C5:1 D5:1 E5:1 D5:1 C5:2 B4:1 A4:1 G#4:1 B4:1 A4:2',
       'A2 E2 A2 E2'],
      ['C6:1 B5:1 A5:2 B5:1 A5:1 G5:2 A5:1 G5:1 F5:1 E5:1 E5:4 ' +
       'E5:1 A5:1 A5:1 B5:1 C6:1 D6:1 E6:1 D6:1 C6:2 B5:1 A5:1 G#5:1 B5:1 A5:2',
       'A2 E2 A2 E2']
    ]
  },
  {
    name: 'TROIKA', bpm: 200, bar: 8, style: 'gallop', drum: 'khshkhsh', leads: ['p25', 'p125'], p2: 'echo',
    parts: [
      ['A4:1 D5:1 F5:1 A5:1 G5:1 F5:1 E5:1 D5:1 C#5:1 E5:1 A5:2 A4:2 R:2 ' +
       'D5:1 F5:1 A5:1 D6:1 C6:1 A#5:1 A5:1 G5:1 F5:2 E5:1 F5:1 D5:4 ' +
       'A#4:1 D5:1 F5:1 A#5:1 A5:1 G5:1 F5:1 D5:1 C5:1 E5:1 G5:1 C6:1 A#5:1 A5:1 G5:1 E5:1 ' +
       'F5:1 A5:1 D6:2 C#6:1 E6:1 A5:2 D6:2 A5:1 F5:1 D5:2 R:2',
       'D2 A2 D2 D2 A#1 C2 A2 D2'],
      ['F5:2 A5:2 C6:2 A5:2 G5:2 A#5:2 D6:2 A#5:2 A5:1 G5:1 F5:1 E5:1 F5:2 C5:2 D5:1 E5:1 F5:1 G5:1 A5:4 ' +
       'A#5:1 A5:1 G5:1 F5:1 G5:2 E5:2 A5:1 G5:1 F5:1 E5:1 F5:2 D5:2 E5:1 F5:1 G5:1 E5:1 C#5:2 A4:2 D5:2 F5:2 D5:4',
       'F2 G2 F2 D2 G2 D2 A2 D2']
    ]
  },
  {
    name: 'VOLGA', bpm: 132, bar: 6, style: 'waltz', drum: 'k.h.h.', leads: ['p50'], p2: 'octave',
    parts: [
      ['E5:4 D5:1 C5:1 B4:2 A4:2 B4:2 C5:4 B4:1 A4:1 G#4:6 A4:2 B4:2 C5:2 D5:3 C5:1 B4:2 C5:2 B4:2 A4:2 E5:6 ' +
       'F5:4 E5:1 D5:1 E5:4 C5:2 D5:4 C5:1 B4:1 C5:4 A4:2 B4:2 C5:2 D5:2 E5:3 D5:1 C5:2 B4:2 G#4:2 B4:2 A4:6',
       'A2 E2 A2 E2 A2 G2 A2 E2 D2 A2 G2 A2 G2 C2 E2 A2']
    ]
  },
  {
    name: 'MATRYOSHKA', bpm: 160, bar: 8, style: 'oct', drum: 'khshkksh', leads: ['p125', 'p25'], p2: 'echo',
    parts: [
      ['E5:1 E5:1 B4:1 E5:1 G5:2 F#5:1 E5:1 F#5:1 F#5:1 D5:1 F#5:1 A5:2 G5:1 F#5:1 ' +
       'G5:1 A5:1 B5:1 G5:1 E5:1 F#5:1 G5:1 E5:1 F#5:2 D#5:2 B4:4 ' +
       'E5:1 E5:1 B4:1 E5:1 G5:2 F#5:1 E5:1 D5:1 D5:1 A4:1 D5:1 F#5:2 E5:1 D5:1 ' +
       'C5:1 E5:1 A5:2 B4:1 D#5:1 F#5:2 E5:4 R:4',
       'E2 D2 E2 B1 E2 D2 A1 E2'],
      ['G5:2 G5:1 A5:1 B5:2 G5:2 A5:2 A5:1 B5:1 C6:2 A5:2 B5:1 A5:1 G5:1 F#5:1 E5:2 G5:2 F#5:1 E5:1 D5:1 C5:1 B4:4 ' +
       'G5:2 G5:1 A5:1 B5:2 E6:2 D6:1 C6:1 B5:1 A5:1 G5:2 E5:2 C5:1 E5:1 A5:2 B4:1 D#5:1 F#5:2 E5:4 R:4',
       'G2 A2 E2 B1 G2 G2 A1 E2']
    ]
  },
  {
    name: 'KAZACHOK', bpm: 180, bar: 8, style: 'gallop', drum: 'khshkhsh', leads: ['p25', 'p50'], p2: 'echo',
    parts: [
      ['A4:1 C5:1 E5:1 A5:1 G#5:1 A5:1 E5:2 F5:1 E5:1 D5:1 C5:1 B4:1 C5:1 A4:2 ' +
       'A4:1 C5:1 E5:1 A5:1 G#5:1 A5:1 B5:2 C6:1 B5:1 A5:1 G#5:1 A5:4 ' +
       'G5:1 F5:1 E5:1 D5:1 E5:1 F5:1 G5:2 F5:1 E5:1 D5:1 C5:1 D5:1 E5:1 F5:2 ' +
       'E5:1 D5:1 C5:1 B4:1 C5:1 D5:1 E5:1 G#4:1 A4:2 E4:2 A4:4',
       'A2 D2 A2 E2 C2 D2 E2 A2'],
      ['E5:2 E5:1 F5:1 E5:2 D5:2 C5:2 C5:1 D5:1 C5:2 B4:2 A4:1 B4:1 C5:1 D5:1 E5:1 F5:1 E5:2 E5:8 ' +
       'E5:2 E5:1 F5:1 E5:2 D5:2 C5:2 C5:1 D5:1 C5:2 B4:2 A4:1 C5:1 B4:1 G#4:1 A4:1 B4:1 G#4:2 A4:4 R:4',
       'A2 A2 D2 E2 A2 A2 E2 A2']
    ]
  }
];

const Sound = (() => {
  let ac = null, master, musicBus, sfxBus, noiseBuf, noiseShort, pulse25, pulse125, triWave;
  let muted = store.get('tetris88-muted', false);
  const music = { on: false, track: 0, step: 0, next: 0, fast: false, mul: 1 };

  const N = s => {
    const m = /^([A-G])(#?)(\d)$/.exec(s);
    return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] ? 1 : 0);
  };
  const freq = m => 440 * Math.pow(2, (m - 69) / 12);
  const BASS = {
    oct:    [0, 12, 0, 12, 0, 12, 0, 12],
    gallop: [0, 12, 7, 12, 0, 12, 7, 12],
    waltz:  [0, null, 12, null, 19, null]
  };
  const DRUM = { k: 'kick', s: 'snare', h: 'hat' };

  function build(song) {
    const steps = [];
    const add = (pos, ev) => (steps[pos] || (steps[pos] = [])).push(ev);
    let pos = 0;
    song.parts.forEach(([mel, bass], p) => {
      const start = pos, roots = bass.split(' '), pat = BASS[song.style];
      const lead = song.leads[p % song.leads.length];  // duty cycle changes between sections
      roots.forEach((root, b) => pat.forEach((o, i) => { if (o !== null) add(start + b * song.bar + i, { v: 'bass', m: N(root) + o }); }));
      const total = roots.length * song.bar, fill = song.bar === 6 ? 3 : 4;
      for (let i = 0; i < total; i++) {
        // drum fill at the end of each section: snare + descending triangle toms
        if (i >= total - fill) { const j = i - (total - fill); add(start + i, { v: 'snare' }); add(start + i, { v: 'tom', f: 300 - j * 50 }); continue; }
        const d = song.drum[i % song.bar];
        if (d !== '.') add(start + i, { v: DRUM[d] });
      }
      for (const tok of mel.trim().split(/\s+/)) {
        const [n, l] = tok.split(':');
        if (n !== 'R') add(pos, { v: 'mel', m: N(n), len: +l, lead });
        pos += +l;
      }
      if (pos !== start + total) console.warn(`${song.name}: melody ${pos - start} steps, bass ${total}`);
    });
    return { steps, length: pos, bpm: song.bpm, p2: song.p2, accel: !!song.accel };
  }
  const built = SONGS.map(build);

  function makePulse(duty) {
    const n = 64, re = new Float32Array(n), im = new Float32Array(n);
    for (let k = 1; k < n; k++) re[k] = 2 / (k * Math.PI) * Math.sin(k * Math.PI * duty);
    return ac.createPeriodicWave(re, im);
  }

  // NES triangle channel: 32-step, 4-bit staircase (15..0, 0..15), turned into a PeriodicWave by DFT
  function makeNesTriangle() {
    const N = 512, H = 48, re = new Float32Array(H), im = new Float32Array(H), s = [];
    for (let i = 0; i < N; i++) { const step = Math.floor(i * 32 / N); s.push((step < 16 ? 15 - step : step - 16) / 7.5 - 1); }
    for (let k = 1; k < H; k++) {
      let a = 0, b = 0;
      for (let i = 0; i < N; i++) { a += s[i] * Math.cos(2 * Math.PI * k * i / N); b += s[i] * Math.sin(2 * Math.PI * k * i / N); }
      re[k] = 2 * a / N; im[k] = 2 * b / N;
    }
    return ac.createPeriodicWave(re, im);
  }

  // NES noise channel: 15-bit LFSR; tap 1 = long (hiss), tap 6 = short 93-step loop (metallic)
  function makeLfsrNoise(tap, length, hold) {
    const buf = ac.createBuffer(1, length, ac.sampleRate), d = buf.getChannelData(0);
    let lfsr = 1, out = 1;
    for (let i = 0; i < length; i++) {
      if (i % hold === 0) {
        const fb = (lfsr ^ (lfsr >> tap)) & 1;
        lfsr = (lfsr >> 1) | (fb << 14);
        out = lfsr & 1 ? -1 : 1;
      }
      d[i] = out;
    }
    return buf;
  }

  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ac = new AC();
    // NES-ish output stage: DC-blocking high-pass + gentle low-pass
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 12000;
    master = ac.createGain(); master.gain.value = muted ? 0 : 0.5;
    master.connect(hp).connect(lp).connect(ac.destination);
    musicBus = ac.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
    sfxBus = ac.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
    noiseBuf = makeLfsrNoise(1, ac.sampleRate, 4);
    noiseShort = makeLfsrNoise(6, 93 * 4, 4);
    pulse25 = makePulse(0.25);
    pulse125 = makePulse(0.125);
    triWave = makeNesTriangle();
    setInterval(schedule, 25);
  }

  // o.env: NES-style volume envelope (fast attack, decay to ~65% sustain)
  // o.vib: delayed vibrato, as used on long lead notes
  function tone(f, t, dur, o = {}) {
    const osc = ac.createOscillator(), g = ac.createGain();
    if (o.wave && typeof o.wave !== 'string') osc.setPeriodicWave(o.wave); else osc.type = o.wave || 'square';
    osc.frequency.setValueAtTime(f, t);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t + dur);
    const v = o.vol == null ? 0.2 : o.vol, a = 0.004, r = Math.min(0.03, dur * 0.4);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(v, t + a);
    let sus = v, hold = t + a;
    if (o.env) { sus = v * 0.65; hold = t + Math.max(a + 0.001, Math.min(0.15, dur * 0.6)); g.gain.linearRampToValueAtTime(sus, hold); }
    g.gain.setValueAtTime(sus, Math.max(hold, t + dur - r));
    g.gain.linearRampToValueAtTime(0, t + dur);
    if (o.vib && dur > 0.22) {
      const lfo = ac.createOscillator(), depth = ac.createGain();
      lfo.frequency.value = 6;
      depth.gain.setValueAtTime(0, t);
      depth.gain.setValueAtTime(0, t + 0.12);
      depth.gain.linearRampToValueAtTime(f * 0.012, t + 0.3);
      lfo.connect(depth).connect(osc.frequency);
      lfo.start(t); lfo.stop(t + dur + 0.05);
    }
    osc.connect(g).connect(o.bus || sfxBus);
    osc.start(t); osc.stop(t + dur + 0.02);
  }

  function noise(t, dur, o = {}) {
    const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
    src.buffer = o.short ? noiseShort : noiseBuf;
    src.loop = true;
    if (o.rate) src.playbackRate.value = o.rate;
    f.type = o.type || 'lowpass'; f.frequency.value = o.freq || 2000;
    g.gain.setValueAtTime(o.vol || 0.3, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(f).connect(g).connect(o.bus || sfxBus);
    src.start(t); src.stop(t + dur + 0.02);
  }

  const arp = (t, notes, gap, dur, o) => notes.forEach((f, i) => tone(f, t + i * gap, dur, o));
  const SFX = {
    move:    t => tone(880, t, .03, { wave: pulse125, vol: .1 }),
    rotate:  t => { tone(660, t, .03, { wave: pulse25, vol: .1 }); tone(990, t + .03, .03, { wave: pulse25, vol: .1 }); },
    lock:    t => { noise(t, .07, { vol: .35, freq: 900 }); tone(110, t, .06, { wave: 'triangle', vol: .35 }); },
    hard:    t => { noise(t, .16, { vol: .5, freq: 1600 }); tone(180, t, .12, { wave: 'triangle', vol: .45, slide: 45 }); },
    hold:    t => { tone(520, t, .04, { wave: pulse25, vol: .12 }); tone(780, t + .04, .05, { wave: pulse25, vol: .12 }); },
    clear:   t => arp(t, [523, 659, 784, 1047], .05, .08, { wave: pulse25, vol: .15 }),
    tetris:  t => { arp(t, [523, 659, 784, 1047, 1319, 1568, 2093], .045, .1, { vol: .12 }); noise(t, .45, { vol: .25, freq: 5000 }); },
    spin:    t => { tone(300, t, .22, { wave: pulse25, vol: .15, slide: 1600 }); tone(450, t + .05, .22, { wave: pulse125, vol: .1, slide: 2400 }); },
    perfect: t => arp(t, [1047, 1319, 1568, 2093, 1568, 2093, 2637], .07, .12, { wave: pulse25, vol: .14 }),
    levelup: t => arp(t, [784, 988, 1175, 1568], .08, .12, { wave: pulse125, vol: .15 }),
    gameover:t => arp(t, [523, 494, 466, 440, 415, 392, 370, 349, 330], .11, .14, { vol: .14 }),
    pause:   t => { tone(988, t, .05, { vol: .12 }); tone(1319, t + .07, .09, { vol: .12 }); },
    select:  t => tone(1200, t, .04, { wave: pulse25, vol: .12 }),
    start:   t => arp(t, [659, 880, 1319, 1760], .06, .1, { wave: pulse25, vol: .15 }),
    ready:   t => { tone(784, t + .2, .1, { wave: pulse25, vol: .14 }); tone(784, t + .5, .1, { wave: pulse25, vol: .14 }); tone(1568, t + .8, .25, { wave: pulse25, vol: .14 }); },
    stageclear: t => {
      arp(t, [523, 659, 784, 1047, 784, 1047, 1319, 1568], .1, .14, { wave: pulse25, vol: .15 });
      arp(t, [131, 165, 196, 262, 196, 262, 330, 392], .1, .14, { wave: 'triangle', vol: .35 });
      tone(2093, t + .85, .5, { wave: pulse125, vol: .14 });
    }
  };

  // Pulse 1 = lead, pulse 2 = echo (one step late, quiet) or octave-below double,
  // triangle = bass and kick/tom sweeps, noise = snare and metallic hi-hat.
  function playEvent(ev, t, e, song) {
    const bus = musicBus;
    switch (ev.v) {
      case 'mel': {
        const wave = ev.lead === 'p125' ? pulse125 : ev.lead === 'p50' ? 'square' : pulse25;
        const dur = ev.len * e * 0.92;
        tone(freq(ev.m), t, dur, { wave, vol: ev.lead === 'p50' ? .11 : .15, bus, env: true, vib: true });
        if (song.p2 === 'octave') tone(freq(ev.m - 12), t, dur, { wave: pulse125, vol: .07, bus, env: true, vib: true });
        else tone(freq(ev.m), t + e, dur * 0.9, { wave: pulse125, vol: .05, bus, env: true });
        break;
      }
      case 'bass':  tone(freq(ev.m), t, e * 0.8, { wave: triWave, vol: .5, bus }); break;
      case 'kick':  tone(220, t, .07, { wave: triWave, vol: .6, slide: 45, bus }); noise(t, .03, { vol: .12, freq: 1200, bus }); break;
      case 'snare': noise(t, .13, { vol: .22, freq: 6000, bus }); tone(190, t, .04, { wave: triWave, vol: .3, slide: 110, bus }); break;
      case 'hat':   noise(t, .03, { short: true, rate: 2, vol: .05, freq: 5000, type: 'highpass', bus }); break;
      case 'tom':   tone(ev.f, t, .11, { wave: triWave, vol: .55, slide: ev.f * 0.5, bus }); noise(t, .06, { vol: .1, freq: 3000, bus }); break;
    }
  }

  function schedule() {
    if (!ac || !music.on) return;
    const song = built[music.track];
    if (music.next < ac.currentTime) music.next = ac.currentTime + 0.05;
    while (music.next < ac.currentTime + 0.15) {
      const e = 60 / (song.bpm * music.mul * (music.fast ? 1.3 : 1)) / 2;
      const evs = song.steps[music.step];
      if (evs) for (const ev of evs) playEvent(ev, music.next, e, song);
      music.next += e;
      music.step = (music.step + 1) % song.length;
      // accelerando: each loop a little faster, then back to the start tempo
      if (music.step === 0 && song.accel) music.mul = music.mul >= 1.6 ? 1 : music.mul * 1.1;
    }
  }

  return {
    init,
    tracks: SONGS.map(s => s.name),
    sfx(name) { if (ac && !muted) SFX[name](ac.currentTime); },
    musicStart(track, delay = 0.1) {
      if (track < 0) { music.on = false; return; }
      music.on = true; music.track = track % built.length; music.step = 0; music.mul = 1;
      if (ac) music.next = ac.currentTime + delay;
    },
    musicStop() { music.on = false; },
    musicPause(p) { music.on = !p; if (!p && ac) music.next = ac.currentTime + 0.05; },
    setFast(f) { music.fast = f; },
    toggleMute() {
      muted = !muted; store.set('tetris88-muted', muted);
      if (master) master.gain.setValueAtTime(muted ? 0 : 0.5, ac.currentTime);
    },
    get muted() { return muted; }
  };
})();

function text(s, x, y, color = '#fcfcfc', align = 'left') {
  ctx.font = '8px "Press Start 2P", monospace';
  ctx.textBaseline = 'top';
  ctx.textAlign = 'left';
  const w = ctx.measureText(s).width, adv = s.length ? w / s.length : 0;

let mode = 'title';              // title | game | over
let demo = false, paused = false, win = false;
let playMode = 'marathon';       // mode of the running game: marathon | stage
let board, piece, queue, bag, rng, holdType, holdUsed;
let score = 0, lines = 0, level = 0, combo = -1, b2b = false;
let stage = 1, stageGoal = 0, stageLines = 0;
let dropT = 0, lockT = 0, lastRot = false, lastKick = 0;
let clearAnim = null, banner = null, popup = null, overT = 0, flash = 0, shake = 0, dropFx = null;
let clock = 0, idleT = 0, demoT = 0, aiT = 0, aiPlan = null, demoCount = 0;

// title menu selections (remembered)
const prefs = store.get('tetris88-prefs', {});
let selMode = 'stage';           // stage mode is the default every time
let startLevel = prefs.level | 0, startStage = Math.min(STAGE_COUNT, Math.max(1, prefs.stage | 0 || 1));
let musicSel = Number.isInteger(prefs.music) && prefs.music < SONGS.length ? prefs.music : 0;
let titleSel = 0;
const savePrefs = () => store.set('tetris88-prefs', { level: startLevel, stage: startStage, music: musicSel });

const bestScores = store.get('tetris88-best2', { marathon: store.get('tetris88-best', 0), stage: 0 });
const bestFor = m => bestScores[m] || 0;

const play = name => { if (!demo) Sound.sfx(name); };

function rotateMatrix(m, dir) {
  const n = m.length, r = Array.from({ length: n }, () => Array(n).fill(0));
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++)
    if (dir > 0) r[x][n - 1 - y] = m[y][x]; else r[n - 1 - x][y] = m[y][x];
  return r;
}

function nextFromBag() {
  if (!bag.length) {
    bag = Object.keys(SHAPES);
    for (let i = bag.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [bag[i], bag[j]] = [bag[j], bag[i]]; }
  }
  return bag.pop();
}

function makePiece(type) {
  const shape = SHAPES[type].map(r => r.slice());
  return { type, shape, rot: 0, x: Math.floor((COLS - shape.length) / 2), y: type === 'I' ? -1 : 0, lowest: 0 };
}

function collides(shape, px, py) {
  for (let y = 0; y < shape.length; y++) for (let x = 0; x < shape[y].length; x++) {
    if (!shape[y][x]) continue;
    const bx = px + x, by = py + y;
    if (bx < 0 || bx >= COLS || by >= ROWS) return true;
    if (by >= 0 && board[by][bx]) return true;
  }
  return false;
}

const emptyBoard = () => Array.from({ length: ROWS }, () => Array(COLS).fill(null));

function newGame(isDemo) {
  demo = isDemo; paused = false; win = false;
  playMode = isDemo ? 'marathon' : selMode;
  rng = isDemo ? mulberry32(1988 + demoCount++) : Math.random;
  board = emptyBoard();
  bag = []; queue = Array.from({ length: 5 }, nextFromBag);
  holdType = null; holdUsed = false;
  score = 0; lines = 0; combo = -1; b2b = false;
  clearAnim = null; banner = null; popup = null; flash = 0; dropFx = null; piece = null;
  demoT = 0; aiPlan = null;
  for (const k in held) delete held[k];
  mode = 'game';
  if (playMode === 'stage') { stage = startStage; setupStage(); return; }
  level = isDemo ? 5 : startLevel;
  if (isDemo) Sound.musicStop(); else Sound.musicStart(musicSel);
  spawn();
}

function toTitle() {
  mode = 'title'; demo = false; paused = false; piece = null; banner = null; idleT = 0;
  Sound.musicStop();
}

// ---------- stage mode ----------
// Each stage starts with a fixed garbage pattern; clear the goal number of lines to advance.
const stageInfo = s => ({
  level: Math.min(19, s - 1),
  goal: Math.min(20, 6 + s),
  garbage: Math.min(12, 1 + Math.ceil(s / 2))
});
const stageTrack = () => musicSel < 0 ? -1 : (musicSel + stage - startStage) % SONGS.length;

function setupStage() {
  const info = stageInfo(stage);
  board = emptyBoard();
  const r = mulberry32(stage * 7919 + 13), types = Object.keys(SHAPES);
  for (let i = 0; i < info.garbage; i++) {
    const y = ROWS - 1 - i;
    const holes = new Set([r() * COLS | 0]);
    if (r() < 0.3 || i >= info.garbage - 2) holes.add(r() * COLS | 0);
    for (let x = 0; x < COLS; x++) board[y][x] = holes.has(x) ? null : types[r() * types.length | 0];
  }
  level = info.level; stageGoal = info.goal; stageLines = 0;
  combo = -1; holdUsed = false; piece = null; clearAnim = null;
  Sound.musicStart(stageTrack());
  play('ready');
  banner = { lines: ['STAGE ' + pad(stage, 2), 'GOAL ' + pad(stageGoal, 2), '', 'READY'], t: 0, dur: 1600, then: () => spawn() };
}

function stageClear() {
  const empty = board.filter(r => r.every(c => !c)).length;
  const bonus = 1000 * stage + 100 * empty * stage;
  score += bonus;
  saveBest();
  piece = null;
  play('stageclear');
  if (musicSel >= 0) Sound.musicStart(SONGS.findIndex(s => s.name === 'KAZACHOK'), 1.1); else Sound.musicStop();
  // Cossack dance intermission (Enter/Space skips)
  banner = {
    dance: true, bonus, t: 0, dur: 6000,
    then: () => { if (stage >= STAGE_COUNT) return winGame(); stage++; setupStage(); }
  };
}

function winGame() {
  mode = 'over'; win = true; overT = 0; piece = null;
  Sound.musicStop();
  play('perfect');
  saveBest();
}

function spawn(type) {
  if (!type) { type = queue.shift(); queue.push(nextFromBag()); }
  piece = makePiece(type);
  piece.lowest = piece.y;
  dropT = 0; lockT = 0; lastRot = false; lastKick = 0;
  if (collides(piece.shape, piece.x, piece.y)) topOut();
}

const onGround = () => collides(piece.shape, piece.x, piece.y + 1);
const gravityMs = () => GRAVITY[Math.min(level, GRAVITY.length - 1)] * 1000 / 60;

function stepDown(soft) {
  piece.y++;
  lastRot = false;
  if (piece.y > piece.lowest) { piece.lowest = piece.y; lockT = 0; }
  if (soft) score++;
}

// Infinity: every successful move or rotation resets the lock timer
function move(dx) {
  if (collides(piece.shape, piece.x + dx, piece.y)) return false;
  piece.x += dx; lastRot = false; lockT = 0;
  play('move');
  return true;
}

function rotate(dir) {
  if (piece.type === 'O') return false;
  const shape = rotateMatrix(piece.shape, dir);
  const from = piece.rot, to = (from + dir + 4) % 4;
  const kicks = (piece.type === 'I' ? KICKS_I : KICKS)[from + '>' + to];
  for (let i = 0; i < kicks.length; i++) {
    const [kx, ky] = kicks[i];
    if (!collides(shape, piece.x + kx, piece.y - ky)) {
      piece.shape = shape; piece.rot = to; piece.x += kx; piece.y -= ky;
      if (piece.y > piece.lowest) piece.lowest = piece.y;
      lastRot = true; lastKick = i; lockT = 0;
      play('rotate');
      return true;
    }
  }
  return false;
}

function softDrop() {
  if (!onGround()) { stepDown(true); dropT = 0; }
}

function hardDrop() {
  const y0 = piece.y;
  while (!onGround()) piece.y++;
  const d = piece.y - y0;
  if (d > 0) lastRot = false;
  score += d * 2;
  const cols = new Set();
  piece.shape.forEach(row => row.forEach((v, x) => v && cols.add(piece.x + x)));
  dropFx = { cols: [...cols], y0: y0, y1: piece.y, type: piece.type, t: 0 };
  shake = 120;
  play('hard');
  lock(true);
}

function hold() {
  if (holdUsed) return;
  const cur = piece.type;
  if (holdType) spawn(holdType); else spawn();
  holdType = cur; holdUsed = true;
  play('hold');
}

// T-spin by 3-corner rule; other pieces count as (mini) spins when immobile
function detectSpin() {
  if (!lastRot) return null;
  const p = piece;
  if (p.type === 'T') {
    const filled = (x, y) => {
      const bx = p.x + x, by = p.y + y;
      return bx < 0 || bx >= COLS || by >= ROWS || (by >= 0 && !!board[by][bx]);
    };
    const occ = [[0, 0], [2, 0], [2, 2], [0, 2]].map(([x, y]) => filled(x, y));
    if (occ.filter(Boolean).length < 3) return null;
    const front = [[0, 1], [1, 2], [2, 3], [3, 0]][p.rot];
    const full = (occ[front[0]] && occ[front[1]]) || lastKick === 4;
    return { type: 'T', mini: !full };
  }
  if (p.type === 'O') return null;
  const stuck = collides(p.shape, p.x - 1, p.y) && collides(p.shape, p.x + 1, p.y) && collides(p.shape, p.x, p.y - 1);
  return stuck ? { type: p.type, mini: true } : null;
}

function lock(hard) {
  const spin = detectSpin();
  let above = true;
  piece.shape.forEach((row, y) => row.forEach((v, x) => {
    if (!v) return;
    const by = piece.y + y;
    if (by >= 0) { board[by][piece.x + x] = piece.type; above = false; }
  }));
  if (above) return topOut();

  const full = [];
  for (let y = 0; y < ROWS; y++) if (board[y].every(c => c)) full.push(y);
  const n = full.length, mult = level + 1, msg = [];
  let pts = 0;

  if (spin) {
    msg.push(spin.type + '-SPIN');
    if (spin.type === 'T' && !spin.mini) pts = [400, 800, 1200, 1600][n];
    else { pts = [100, 200, 400, 600][n]; if (spin.type === 'T') msg.push('MINI'); }
  } else pts = [0, 100, 300, 500, 800][n];
  if (n) msg.push(['', 'SINGLE', 'DOUBLE', 'TRIPLE', 'TETRIS'][n]);

  if (n) {
    const difficult = n === 4 || !!spin;
    if (difficult && b2b) { pts = Math.floor(pts * 1.5); msg.push('BACK2BACK'); }
    b2b = difficult;
    combo++;
  } else combo = -1;
  pts *= mult;
  if (combo > 0) { pts += 50 * combo * mult; msg.push(combo + ' COMBO'); }
  const perfect = n > 0 && board.every((row, y) => full.includes(y) || row.every(c => !c));
  if (perfect) { pts += [0, 800, 1200, 1800, 2000][n] * mult; msg.push('PERFECT', 'CLEAR!'); }
  score += pts;
  if (msg.length) popup = { lines: msg, t: 0 };

  if (perfect) play('perfect');
  else if (spin) play('spin');
  else if (n === 4) play('tetris');
  else if (n) play('clear');
  else if (!hard) play('lock');

  holdUsed = false;
  saveBest();
  if (n) {
    clearAnim = { rows: full, t: 0 };
    if (n === 4 || perfect) flash = 1;
    piece = null;
  } else spawn();
}

function finishClear() {
  const n = clearAnim.rows.length;
  board = board.filter((_, y) => !clearAnim.rows.includes(y));
  while (board.length < ROWS) board.unshift(Array(COLS).fill(null));
  lines += n;
  clearAnim = null;
  if (playMode === 'stage') {
    stageLines += n;
    if (stageLines >= stageGoal) return stageClear();
  } else {
    const nl = Math.max(demo ? 5 : startLevel, Math.floor(lines / 10));
    if (nl > level) {
      level = nl;
      play('levelup');
      if (!popup) popup = { lines: [], t: 0 };
      popup.lines.push('LEVEL UP'); popup.t = 0;
    }
  }
  spawn();
}

function topOut() {
  piece = null;
  if (demo) return toTitle();
  mode = 'over'; win = false; overT = 0;
  Sound.musicStop();
  Sound.sfx('gameover');
  saveBest();
}

function saveBest() {
  if (demo || score <= bestFor(playMode)) return;
  bestScores[playMode] = score;
  store.set('tetris88-best2', bestScores);
}

const ghostY = () => { let y = piece.y; while (!collides(piece.shape, piece.x, y + 1)) y++; return y; };
const danger = () => board && board.slice(0, 5).some(r => r.some(Boolean));

// ================= demo AI =================
function evaluate(shape, px, py) {
  const b = board.map(r => r.map(c => c ? 1 : 0));
  let above = false;
  shape.forEach((row, y) => row.forEach((v, x) => { if (v) { if (py + y < 0) above = true; else b[py + y][px + x] = 1; } }));
  if (above) return -1e9;
  let cleared = 0;
  for (let y = ROWS - 1; y >= 0; y--) if (b[y].every(Boolean)) { b.splice(y, 1); b.unshift(Array(COLS).fill(0)); cleared++; y++; }
  const h = Array(COLS).fill(0);
  let holes = 0;
  for (let x = 0; x < COLS; x++) {
    let seen = false;
    for (let y = 0; y < ROWS; y++) {
      if (b[y][x]) { if (!seen) { h[x] = ROWS - y; seen = true; } }
      else if (seen) holes++;
    }
  }
  let agg = 0, bump = 0;
  for (let x = 0; x < COLS; x++) { agg += h[x]; if (x) bump += Math.abs(h[x] - h[x - 1]); }
  return -0.51 * agg + 0.76 * cleared - 0.36 * holes - 0.18 * bump;
}

function aiBest() {
  let bestMove = null, shape = SHAPES[piece.type].map(r => r.slice());
  for (let r = 0; r < (piece.type === 'O' ? 1 : 4); r++) {
    for (let x = -2; x < COLS; x++) {
      let y = piece.y;
      if (collides(shape, x, y)) continue;
      while (!collides(shape, x, y + 1)) y++;
      const s = evaluate(shape, x, y);
      if (!bestMove || s > bestMove.score) bestMove = { rot: r, x, score: s };
    }
    shape = rotateMatrix(shape, 1);
  }
  return bestMove || { rot: 0, x: piece.x };
}

function updateDemo(dt) {
  demoT += dt;
  if (demoT > DEMO_LEN_MS) return toTitle();
  aiT += dt;
  if (aiT < 70 || !piece) return;
  aiT = 0;
  if (!aiPlan || aiPlan.piece !== piece) aiPlan = { piece, tries: 0, ...aiBest() };
  if (++aiPlan.tries > 20) return hardDrop();
  if (piece.rot !== aiPlan.rot) rotate(aiPlan.rot === 3 ? -1 : 1);
  else if (piece.x !== aiPlan.x) { if (!move(piece.x < aiPlan.x ? 1 : -1)) hardDrop(); }
  else hardDrop();
}

// ================= input =================
const held = {};
function handleRepeat(dt) {
  for (const k of ['ArrowLeft', 'ArrowRight', 'ArrowDown']) {
    const h = held[k];
    if (!h || !piece) continue;
    h.t += dt;
    const delay = k === 'ArrowDown' ? 0 : DAS, rate = k === 'ArrowDown' ? SDR : ARR;
    while (piece && h.t >= delay + rate) {
      h.t -= rate;
      if (k === 'ArrowDown') softDrop(); else move(k === 'ArrowLeft' ? -1 : 1);
    }
  }
}

function togglePause() {
  paused = !paused;
  Sound.musicPause(paused);
  Sound.sfx('pause');
}

// title menu: 0 mode, 1 level/stage, 2 music
function changeOption(d) {
  if (titleSel === 0) selMode = selMode === 'marathon' ? 'stage' : 'marathon';
  else if (titleSel === 1) {
    if (selMode === 'marathon') startLevel = (startLevel + d + 20) % 20;
    else startStage = (startStage - 1 + d + STAGE_COUNT) % STAGE_COUNT + 1;
  } else {
    const total = SONGS.length + 1;  // + OFF
    musicSel = ((musicSel + 1 + d) % total + total) % total - 1;
  }
  savePrefs();
}

document.addEventListener('keydown', e => {
  Sound.init();
  const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' '].includes(k)) e.preventDefault();
  if (k === 'm' || k === 'M') { Sound.toggleMute(); return; }
  idleT = 0;

  if (mode === 'title') {
    if (e.repeat) return;
    if (k === 'ArrowUp') { titleSel = (titleSel + 2) % 3; Sound.sfx('select'); }
    else if (k === 'ArrowDown') { titleSel = (titleSel + 1) % 3; Sound.sfx('select'); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { changeOption(k === 'ArrowRight' ? 1 : -1); Sound.sfx('select'); }
    else if (k === 't' || k === 'T') { TEST = !TEST; Sound.sfx('select'); }
    else if (k === 'Enter' || k === ' ') { Sound.sfx('start'); newGame(false); }
    return;
  }
  if (demo) { toTitle(); return; }
  if (mode === 'over') { if (overT > 1200 && (k === 'Enter' || k === ' ' || k === 'Escape')) toTitle(); return; }
  if (k === 'p' || k === 'P' || k === 'Escape') { togglePause(); return; }
  if (paused || e.repeat) return;
  if (banner && banner.dance) { if ((k === 'Enter' || k === ' ') && banner.t > 800) banner.t = banner.dur; return; }

  if (k === 'ArrowLeft') { held.ArrowLeft = { t: 0 }; delete held.ArrowRight; }
  if (k === 'ArrowRight') { held.ArrowRight = { t: 0 }; delete held.ArrowLeft; }
  if (k === 'ArrowDown') held.ArrowDown = { t: 0 };
  if (!piece) return;  // line clear or stage banner in progress
  if (TEST && (k === 'k' || k === 'K') && playMode === 'stage') { stageClear(); return; }

  switch (k) {
    case 'ArrowLeft': move(-1); break;
    case 'ArrowRight': move(1); break;
    case 'ArrowDown': softDrop(); break;
    case 'ArrowUp': case 'x': case 'X': rotate(1); break;
    case 'z': case 'Z': case 'Control': rotate(-1); break;
    case ' ': hardDrop(); break;
    case 'c': case 'C': case 'Shift': hold(); break;
  }
});
document.addEventListener('keyup', e => { delete held[e.key]; });
addEventListener('blur', () => {
  for (const k in held) delete held[k];
  if (mode === 'game' && !demo && !paused) togglePause();
});

// ================= update =================
function updateGame(dt) {
  if (mode === 'over') { overT += dt; return; }
  if (paused) return;
  if (banner) {
    banner.t += dt;
    if (banner.t >= banner.dur) { const then = banner.then; banner = null; then(); }
    return;
  }
  if (clearAnim) { clearAnim.t += dt; if (clearAnim.t >= CLEAR_MS) finishClear(); return; }
  if (demo) updateDemo(dt); else handleRepeat(dt);
  if (mode !== 'game' || !piece) return;
  if (onGround()) {
    lockT += dt;
    if (lockT >= LOCK_MS) lock(false);
  } else {
    dropT += dt;
    const g = gravityMs();
    while (dropT >= g && !onGround()) { dropT -= g; stepDown(false); }
    if (onGround()) dropT = 0;
  }
}

// ================= draw =================

function drawFieldFrame() {
  const x0 = FX - 8, y0 = FY - 8, w = COLS * CELL + 16, h = ROWS * CELL + 16;
  fill(x0, y0, w, h, '#6c6c6c');
  for (let y = y0; y < y0 + h; y += 4) {
    fill(x0, y, w, 1, '#383838');
    for (let x = x0 + (((y - y0) / 4) % 2 ? 4 : 0); x < x0 + w; x += 8) { fill(x, y, 1, 4, '#383838'); fill(x + 1, y + 1, 6, 1, '#9c9c9c'); }
  }
  fill(FX - 1, FY - 1, COLS * CELL + 2, ROWS * CELL + 2, '#a4e4fc');
  fill(FX, FY, COLS * CELL, ROWS * CELL, '#000');
  for (let y = 1; y < ROWS; y++) for (let x = 1; x < COLS; x++) fill(FX + x * CELL, FY + y * CELL, 1, 1, '#1c1c44');
}

function drawMini(type, cx, cy, s, dim) {
  const cells = [];
  SHAPES[type].forEach((row, y) => row.forEach((v, x) => v && cells.push([x, y])));
  const xs = cells.map(c => c[0]), ys = cells.map(c => c[1]);
  const minX = Math.min(...xs), minY = Math.min(...ys);
  const w = (Math.max(...xs) - minX + 1) * s, h = (Math.max(...ys) - minY + 1) * s;
  const bx = Math.round(cx - w / 2), by = Math.round(cy - h / 2);
  cells.forEach(([x, y]) => drawBlock(bx + (x - minX) * s, by + (y - minY) * s, COLORS[dim ? 'G' : type], s));
}

// ---------- Cossack dancers (16x20 sprites, drawn at 2x) ----------
const E16 = '................';
const DANCER_TOP = [
  '......hhhh......', '.....hhhhhh.....', '......ssss......', '......bssb......', '......bbbb......',
  '.....rrwwrr.....', '....rwwwwwwr....', '....rrwwwwrr....', '.....yyyyyy.....'
];
const DANCER = {
  squat: [E16, E16, E16, E16, E16, E16, ...DANCER_TOP,
    '....pppppppp....', '...ppp....ppp...', '...pp......pp...', '..kkk......kkk..', '..kkkk....kkkk..'],
  kick: [E16, E16, E16, E16, E16, E16, ...DANCER_TOP,
    'kk..pppppppp....', 'kkpppppp..ppp...', '...........pp...', '..........kkk...', '..........kkkk..'],
  jump: [
    '......hhhh......', '.....hhhhhh.....', '......ssss......', '......bssb......', '......bbbb......',
    'ss...rrwwrr...ss', 'wwwwwrwwwwrwwwww', '.....rrrrrr.....', '.....rrrrrr.....', '.....yyyyyy.....',
    '....pppppppp....', '...ppp....ppp...', '..ppp......ppp..', '.ppp........ppp.', 'kkk..........kkk',
    'kk............kk', E16, E16, E16, E16]
};
const DANCE_SEQ = ['squat', 'kickL', 'squat', 'kickR', 'squat', 'kickL', 'squat', 'kickR', 'jump', 'jump'];

function drawSprite(rows, x, y, pal, s, flip) {
  rows.forEach((row, ry) => {
    for (let rx = 0; rx < row.length; rx++) {
      const ch = row[flip ? row.length - 1 - rx : rx];
      if (ch !== '.') fill(x + rx * s, y + ry * s, s, s, pal[ch]);
    }
  });
}

function drawDance() {
  const t = banner.t;
  drawBackdrop(clock, stage - 1);
  // wooden stage floor + spotlight
  for (let y = 148; y < H; y++) fill(0, y, W, 1, ((y - 148) >> 2) % 2 ? '#8c5c18' : '#a87428');
  for (let x = 12; x < W; x += 24) fill(x, 148, 1, H - 148, '#5c3c08');
  fill(0, 148, W, 2, '#f8d878');
  ctx.globalAlpha = 0.2;
  for (let i = -14; i <= 14; i++) { const w = Math.round(118 * Math.sqrt(1 - (i / 14) ** 2)); fill(128 - w, 178 + i, 2 * w, 1, '#fcfcbc'); }
  ctx.globalAlpha = 1;
  // curtains with folds and a scalloped valance
  const folds = ['#d82800', '#a81000', '#780800', '#a81000'];
  for (let x = 0; x < 36; x++) {
    fill(x, 0, 1, H, folds[(x >> 2) % 4]);
    fill(W - 1 - x, 0, 1, H, folds[(x >> 2) % 4]);
  }
  fill(0, 0, W, 12, '#a81000');
  for (let x = 0; x < W; x += 16) for (let i = 0; i < 6; i++) fill(x + i, 12 + (i >> 1), 16 - 2 * i, 1, '#a81000');
  for (let x = 0; x < W; x += 4) fill(x + 1, 15, 2, 2, '#f8b800');

  const beat = Math.floor(t / 170);
  [['#d82800', 72], ['#0078f8', 128], ['#00a800', 184]].forEach(([shirt, cx], i) => {
    const f = t < 700 ? 'squat' : DANCE_SEQ[beat % DANCE_SEQ.length];
    const rows = f === 'jump' ? DANCER.jump : f === 'squat' ? DANCER.squat : DANCER.kick;
    // outer dancers kick outward, middle one alternates
    const flip = f === 'kickR' ? i !== 0 : f === 'kickL' ? i === 2 : false;
    const pal = { h: '#383838', s: '#fcbcb0', b: '#201008', r: shirt, w: '#fcfcfc', y: '#f8b800', p: '#0000bc', k: '#201008' };
    const y = 190 - 40 + (f === 'jump' ? -10 - (beat % 2) * 4 : 0);
    drawSprite(rows, cx - 16, y, pal, 2, flip);
    if (f === 'jump' && i === 1) text('HEY!', cx, y - 10, '#f8b800', 'center');
  });

  panel(52, 26, 152, 46);
  text('STAGE ' + pad(stage, 2) + ' CLEAR!', 128, 34, '#f8b800', 'center');
  text('BONUS ' + pad(banner.bonus, 6), 128, 48, '#fcfcfc', 'center');
  if (t > 800 && Math.floor(clock / 450) % 2 === 0) text('ENTER', 128, 60, '#a4e4fc', 'center');
}

function drawGame() {
  if (banner && banner.dance && !paused) { drawDance(); return; }
  drawBackdrop(clock, playMode === 'stage' ? stage - 1 : Math.floor(level / 5));
  ctx.save();
  if (shake > 0) ctx.translate(0, Math.round(shake / 60));
  drawFieldFrame();

  if (!paused) {
    // locked blocks (with center-out wipe on clearing rows)
    const step = clearAnim ? Math.min(5, Math.floor(clearAnim.t / CLEAR_MS * 6)) : 0;
    board.forEach((row, y) => row.forEach((t, x) => {
      if (!t) return;
      if (clearAnim && clearAnim.rows.includes(y)) {
        if (x >= 5 - step && x < 5 + step) return;
        if (Math.floor(clearAnim.t / 60) % 2) { fill(FX + x * CELL, FY + y * CELL, CELL - 1, CELL - 1, '#fcfcfc'); return; }
      }
      drawBlock(FX + x * CELL, FY + y * CELL, COLORS[t]);
    }));

    if (dropFx) {
      const a = 1 - dropFx.t / 160;
      ctx.globalAlpha = Math.max(0, a) * 0.5;
      for (const cx of dropFx.cols) {
        const top = Math.max(0, dropFx.y0), bot = dropFx.y1 + 1;
        if (bot > top) fill(FX + cx * CELL + 2, FY + top * CELL, CELL - 4, (bot - top) * CELL, COLORS[dropFx.type][1]);
      }
      ctx.globalAlpha = 1;
    }

    if (piece && mode === 'game') {
      const gy = ghostY(), c = COLORS[piece.type];
      piece.shape.forEach((row, y) => row.forEach((v, x) => {
        if (!v || gy + y < 0) return;
        const px = FX + (piece.x + x) * CELL, py = FY + (gy + y) * CELL;
        ctx.globalAlpha = 0.6;
        fill(px, py, CELL - 1, 1, c[0]); fill(px, py + CELL - 2, CELL - 1, 1, c[0]);
        fill(px, py, 1, CELL - 1, c[0]); fill(px + CELL - 2, py, 1, CELL - 1, c[0]);
        ctx.globalAlpha = 1;
      }));
      piece.shape.forEach((row, y) => row.forEach((v, x) => {

    if (banner) {

  } else if (mode === 'over') {

    if (overT > 1000) {

      text('OVER', FX + 40, FY + 76, '#f83800', 'center');
      if (Math.floor(clock / 450) % 2 === 0) text('ENTER', FX + 40, FY + 90, '#fcfcfc', 'center');
    }
  }

  ctx.restore();

  logoSmall(128, 10, '#f83800');

// ================= main loop =================
let last = performance.now();
function frame(now) {
  const dt = Math.min(50, now - last);
  last = now;
  clock += dt;
  if (mode === 'title') {
    idleT += dt;
    if (idleT > DEMO_IDLE_MS) newGame(true);
  } else updateGame(dt);
  if (popup && !paused) { popup.t += dt; if (popup.t > 2200) popup = null; }
  if (flash > 0) flash = Math.max(0, flash - dt / 220);
  if (shake > 0) shake = Math.max(0, shake - dt);
  if (dropFx) { dropFx.t += dt; if (dropFx.t > 160) dropFx = null; }
  Sound.setFast(mode === 'game' && !demo && !banner && danger());

  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.imageSmoothingEnabled = false;
  if (mode === 'title') drawTitle(); else drawGame();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
