<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>밤의 생존자</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07060a; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; color: #eee; user-select: none; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }

  .overlay { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(6, 3, 12, 0.72); padding: 16px; box-sizing: border-box; }
  .overlay.show { display: flex; }
  .panel { background: #1b1424; border: 4px solid #c9a24a; box-shadow: 0 0 0 4px #1b1424, 0 0 0 8px #5a3a1a; padding: 24px 28px; text-align: center; width: min(92vw, 560px); max-height: 100%; overflow-y: auto; box-sizing: border-box; }
  h1 { margin: 0 0 10px; font-size: clamp(28px, 6vw, 46px); color: #e8c86a; letter-spacing: 4px; text-shadow: 3px 3px 0 #5a1a1a; }
  h2 { margin: 0 0 6px; font-size: clamp(22px, 4.5vw, 32px); color: #e8c86a; text-shadow: 2px 2px 0 #5a1a1a; }
  p { margin: 6px 0; line-height: 1.5; color: #cfc6dd; }
  .hint { font-size: 14px; color: #9a8fb0; }
  .blink { animation: blink 1s steps(2, start) infinite; color: #fff; margin-top: 18px; font-weight: bold; }
  @keyframes blink { to { visibility: hidden; } }

  .cards { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  .card { display: flex; align-items: center; gap: 14px; text-align: left; background: #2a1f38; border: 3px solid #6a5090; color: #eee; padding: 12px 14px; font: inherit; cursor: pointer; }
  .card:hover, .card:focus-visible { border-color: #e8c86a; background: #3a2a50; outline: none; }
  .card .key { flex: none; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; background: #c9a24a; color: #1b1424; font-weight: bold; font-size: 18px; }
  .card .name { font-weight: bold; font-size: 18px; color: #fff; }
  .card .lv { color: #e8c86a; font-size: 14px; margin-left: 6px; }
  .card .desc { font-size: 14px; color: #bdb2d0; margin-top: 2px; }
  .card .hint2 { font-size: 12px; color: #e8c86a; margin-top: 3px; }
  .card.new { border-color: #4a8a5a; }
  .card.new .lv { color: #7aff9a; }
  .icon { flex: none; width: 32px; height: 32px; image-rendering: pixelated; }
  .chest-item { display: flex; gap: 16px; align-items: center; justify-content: center; margin: 18px 0 8px; text-align: left; }
  .chest-item .name { font-weight: bold; font-size: 20px; color: #fff; }
  .chest-item .desc { color: #bdb2d0; margin-top: 4px; }
  .big-icon { width: 64px; height: 64px; }
  .evo h2 { color: #ff9cff; text-shadow: 2px 2px 0 #4a1a5a; }

  .stats { display: grid; grid-template-columns: auto auto; gap: 6px 24px; justify-content: center; margin: 16px 0 20px; font-size: 18px; }
  .stats dt { color: #9a8fb0; text-align: right; }
  .stats dd { margin: 0; text-align: left; font-weight: bold; color: #fff; }
  .big { font: inherit; font-size: 20px; font-weight: bold; padding: 10px 34px; background: #c9a24a; color: #1b1424; border: 3px solid #fff3c4; cursor: pointer; }
  .big:hover, .big:focus-visible { background: #e8c86a; outline: none; }
  .big:disabled { opacity: 0.5; cursor: default; }
  .dead h2 { color: #ff6a5a; }
  .win h2 { color: #ffe680; }

  .evo-tree { display: grid; gap: 6px; margin: 14px 0 6px; text-align: left; }
  .evo-row { display: grid; grid-template-columns: 1fr auto 1fr auto 1.1fr; align-items: center; gap: 6px; background: #2a1f38; border: 2px solid #3a2c4c; padding: 6px 8px; font-size: 13px; }
  .evo-row.ready { border-color: #e8c86a; }
  .evo-row.done { border-color: #b070e0; background: #33204a; }
  .evo-cell { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .evo-cell .icon { width: 24px; height: 24px; }
  .evo-cell b { display: block; color: #fff; word-break: keep-all; }
  .evo-cell small { display: block; color: #9a8fb0; font-size: 11px; }
  .evo-cell.off { opacity: 0.4; }
  .evo-row.ready .evo-res small { color: #e8c86a; }
  .evo-row.done .evo-res b { color: #ff9cff; }
  .evo-op { color: #9a8fb0; font-weight: bold; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="startScreen" class="overlay show">
  <div class="panel">
    <h1>밤의 생존자</h1>
    <p>몰려오는 괴물 속에서 최대한 오래 살아남으세요.</p>
    <p class="hint">이동: WASD / 방향키 · 공격: 자동 · 일시정지: Esc · 음소거: M</p>
    <p class="hint">10분을 버티면 밤의 끝에 무언가가 찾아옵니다.</p>
    <p class="hint" id="debugHint">디버그: B 적 500마리 · R 사신 소환 · F 성능 표시</p>
    <p class="blink">아무 키나 눌러 시작</p>
  </div>
</div>

<div id="levelUpScreen" class="overlay">
  <div class="panel">
    <h2 id="levelUpTitle">레벨 업!</h2>
    <p class="hint">하나를 고르세요 (클릭 또는 1 / 2 / 3)</p>
    <div id="cards" class="cards"></div>
  </div>
</div>

<div id="chestScreen" class="overlay">
  <div class="panel" id="chestPanel">
    <h2 id="chestTitle">보물상자</h2>
    <div class="chest-item">
      <img id="chestIcon" class="icon big-icon" alt="">
      <div><div id="chestName" class="name"></div><div id="chestDesc" class="desc"></div></div>
    </div>
    <p class="hint">Enter / Space 또는 클릭으로 계속</p>
    <button id="chestBtn" class="big">확인</button>
  </div>
</div>

<div id="pauseScreen" class="overlay">
  <div class="panel">
    <h2>일시정지</h2>
    <p class="hint">Esc를 눌러 계속</p>
    <div id="evoTree" class="evo-tree"></div>
    <p class="hint" id="evoRule"></p>
    <p style="margin-top:16px"><button id="resumeBtn" class="big">계속하기</button></p>
  </div>
</div>

<div id="gameOverScreen" class="overlay">
  <div class="panel" id="gameOverPanel">
    <h2 id="gameOverTitle">쓰러졌습니다</h2>
    <p id="gameOverSub"></p>
    <dl class="stats">
      <dt>생존 시간</dt><dd id="resTime">00:00</dd>
      <dt>레벨</dt><dd id="resLevel">1</dd>
      <dt>처치 수</dt><dd id="resKills">0</dd>
    </dl>
    <button id="retryBtn" class="big">다시하기</button>
  </div>
</div>

<script>
'use strict';

// =====================================================================
// CONFIG: 조정 가능한 수치는 모두 여기에. 거리 단위는 "월드 픽셀"(스프라이트 1픽셀)
// =====================================================================
const CONFIG = {
  view: {
    targetHeight: 300,   // 화면 세로에 최소 이만큼의 월드 픽셀이 보이도록 정수 배율 결정
    targetWidth: 400,    // 화면 가로 최소 월드 픽셀
  },
  loop: {
    maxStep: 1 / 30,     // 한 번의 업데이트 최대 시간(초). 프레임이 길면 쪼개서 처리
    maxFrame: 0.1,       // 한 프레임에서 처리할 최대 시간(탭 전환 등으로 튀는 것 방지)
  },
  player: {
    maxHp: 100,
    speed: 90,           // 월드 픽셀/초
    hitRadius: 6,
    invulnTime: 0.5,     // 피격 후 무적 시간(초)
    magnetRadius: 45,    // 경험치 구슬이 빨려오기 시작하는 거리
    pickupRadius: 8,     // 실제 획득 거리
    animInterval: 0.15,  // 걷기 애니메이션 프레임 간격(초)
  },
  weaponSlots: 6,          // 보유 가능한 무기 수
  weaponMaxLevel: 8,       // 이 레벨 + 짝 패시브가 있으면 보물상자에서 진화
  minCooldown: 0.1,        // 공격속도 패시브로 줄어드는 쿨타임 하한(초)
  targetRange: 300,        // 마법 구슬 조준 거리
  // 무기 정의. damage/cooldown/amount/area/speed/duration/pierce가 기본값,
  // levels는 Lv2~Lv8에 차례로 더해지는 값, evolve는 진화 조건(패시브)과 결과
  weapons: {
    orb: { name: '마법 구슬', desc: '가장 가까운 적에게 마법탄을 쏩니다',
      damage: 12, cooldown: 1.0, amount: 1, area: 1, speed: 180, duration: 2.5, pierce: 1,
      radius: 3, knockback: 70, burstDelay: 0.1,
      levels: [{ amount: 1 }, { cooldown: -0.2 }, { amount: 1 }, { damage: 10 }, { amount: 1 }, { pierce: 1 }, { damage: 10 }],
      evolve: { passive: 'attackSpeed', into: 'orbEvo' } },
    orbEvo: { name: '무한 구슬', desc: '쉬지 않고 마법탄을 쏟아냅니다', evolved: true,
      damage: 30, cooldown: 0.3, amount: 3, area: 1, speed: 240, duration: 2.5, pierce: 2,
      radius: 4, knockback: 70, burstDelay: 0.03 },

    whip: { name: '휘두르기', desc: '바라보는 방향을 넓게 벱니다',
      damage: 15, cooldown: 1.3, amount: 1, area: 1, duration: 0.15,
      width: 40, height: 14, knockback: 110, burstDelay: 0.12,
      levels: [{ amount: 1 }, { damage: 5 }, { area: 0.1, damage: 5 }, { damage: 5 }, { area: 0.1, damage: 5 }, { damage: 5 }, { damage: 5 }],
      evolve: { passive: 'maxHp', into: 'whipEvo' } },
    whipEvo: { name: '피의 낫', desc: '거대한 낫으로 베고, 처치할 때마다 체력을 회복합니다', evolved: true,
      damage: 45, cooldown: 1.0, amount: 2, area: 1.5, duration: 0.15,
      width: 40, height: 14, knockback: 140, burstDelay: 0.12, healOnKill: 1 },

    knife: { name: '단검', desc: '이동 방향으로 단검을 빠르게 던집니다',
      damage: 8, cooldown: 0.8, amount: 1, area: 1, speed: 280, duration: 1.2, pierce: 1,
      radius: 3, knockback: 40, burstDelay: 0.06,
      levels: [{ amount: 1 }, { amount: 1, damage: 5 }, { amount: 1 }, { pierce: 1 }, { amount: 1 }, { amount: 1, damage: 5 }, { pierce: 1 }],
      evolve: { passive: 'amount', into: 'knifeEvo' } },
    knifeEvo: { name: '칼날 폭풍', desc: '사방으로 단검을 쉼 없이 흩뿌립니다', evolved: true,
      damage: 18, cooldown: 0.35, amount: 1, area: 1, speed: 300, duration: 1.0, pierce: 3,
      radius: 3, knockback: 40, burstDelay: 0.08, allDirections: 8 },

    orbit: { name: '수호 부적', desc: '부적이 주위를 돌며 닿는 적을 공격합니다',
      damage: 10, cooldown: 3.0, amount: 1, area: 1, speed: 3.5, duration: 3.0,
      orbitRadius: 36, radius: 5, knockback: 60, hitInterval: 0.5,
      levels: [{ amount: 1 }, { speed: 0.6, area: 0.25 }, { duration: 0.5, damage: 10 }, { amount: 1 }, { speed: 0.6, area: 0.25 }, { duration: 0.5, damage: 10 }, { amount: 1 }],
      evolve: { passive: 'moveSpeed', into: 'orbitEvo' } },
    orbitEvo: { name: '질풍 부적', desc: '부적이 멈추지 않고 빠르게 회전합니다', evolved: true,
      damage: 30, cooldown: 0, amount: 4, area: 1.5, speed: 5.5, duration: Infinity,
      orbitRadius: 36, radius: 5, knockback: 80, hitInterval: 0.4 },

    fire: { name: '화염병', desc: '적이 있는 곳에 불타는 장판을 만듭니다',
      damage: 8, cooldown: 3.0, amount: 1, area: 1, duration: 2.0,
      radius: 20, tick: 0.35, burstDelay: 0.15,
      levels: [{ amount: 1, area: 0.2 }, { damage: 5, duration: 0.5 }, { amount: 1 }, { area: 0.2, damage: 5 }, { amount: 1 }, { duration: 0.5, damage: 5 }, { area: 0.2 }],
      evolve: { passive: 'magnet', into: 'fireEvo' } },
    fireEvo: { name: '지옥불', desc: '거대한 불길이 오래도록 타오릅니다', evolved: true,
      damage: 22, cooldown: 2.5, amount: 4, area: 2.0, duration: 5.0,
      radius: 20, tick: 0.3, burstDelay: 0.15 },

    bolt: { name: '번개', desc: '무작위 적에게 번개를 내리칩니다',
      damage: 20, cooldown: 2.5, amount: 2, area: 1,
      radius: 12, burstDelay: 0.08,
      levels: [{ amount: 1 }, { area: 0.5 }, { amount: 1, damage: 10 }, { area: 0.5 }, { amount: 1, damage: 10 }, { cooldown: -0.5 }, { amount: 1 }],
      evolve: { passive: 'damage', into: 'boltEvo' } },
    boltEvo: { name: '심판의 번개', desc: '번개가 주변 적에게 연쇄로 튑니다', evolved: true,
      damage: 45, cooldown: 1.5, amount: 5, area: 2,
      radius: 12, burstDelay: 0.08, chain: 2, chainRange: 70 },
  },
  upgrades: {
    // 패시브: 모든 무기에 적용
    maxLevel: 5,           // 패시브 레벨 상한
    attackSpeedMult: 0.9,  // 공격속도: 레벨마다 모든 무기 쿨타임 ×0.9
    amountAdd: 1,          // 투사체 개수: 레벨마다 모든 무기 +1
    damageAdd: 0.15,       // 데미지: 레벨마다 모든 무기 +15%
    moveSpeedAdd: 0.10,    // 이동속도: 레벨마다 기본값의 +10%
    maxHpMult: 1.20,       // 최대체력: 레벨마다 ×1.2 (늘어난 만큼 회복)
    magnetAdd: 0.25,       // 흡수 범위: 레벨마다 기본값의 +25%
    healAmount: 30,        // 고를 게 없을 때 나오는 '체력 회복'
  },
  elite: {
    firstAt: 60,           // 첫 엘리트 등장 시간(초)
    interval: 90,          // 이후 등장 간격(초). 처치하면 보물상자를 떨굼
    hpMult: 25, damageMult: 2, speedMult: 1.1, sizeMul: 2, xpMult: 10,
  },
  enemies: {
    // kb: 넉백 배율, wobble: 좌우로 흔들리며 날아오는 정도
    bat:    { hp: 5,  speed: 52, damage: 3,  radius: 4, xp: 1, animInterval: 0.12, kb: 1.3, wobble: 0.6 },
    zombie: { hp: 10, speed: 30, damage: 5,  radius: 6, xp: 1, animInterval: 0.3,  kb: 1.0, wobble: 0 },
    giant:  { hp: 40, speed: 20, damage: 12, radius: 9, xp: 6, animInterval: 0.4,  kb: 0.3, wobble: 0 },
  },
  spawn: {
    margin: 24,            // 화면 가장자리 바깥 스폰 거리
    maxEnemies: 800,       // 동시 존재 상한
    relocateFactor: 1.6,   // 플레이어와 (화면 절반 × 이 값)보다 멀어지면 화면 밖 근처로 재배치
    hpPerMin: 0.3,         // 1분마다 적 체력 +30%
    xpPerMin: 0.1,         // 1분마다 적이 주는 경험치 +10%
  },
  // 분 단위 웨이브 표(원작 방식). minCount: 화면에 유지할 최소 마릿수(모자라면 즉시 채움),
  // interval/batch: 추가 스폰 간격(초)과 한 번에 나오는 수, types: 등장 비율
  waves: [
    { minCount: 20,  interval: 0.7,  batch: 1, types: { zombie: 2, bat: 1 } },
    { minCount: 30,  interval: 0.6,  batch: 1, types: { zombie: 2, bat: 2 } },
    { minCount: 40,  interval: 0.7,  batch: 2, types: { zombie: 3, bat: 2, giant: 1 } },
    { minCount: 55,  interval: 0.6,  batch: 2, types: { zombie: 2, bat: 3, giant: 1 } },
    { minCount: 75,  interval: 0.5,  batch: 2, types: { zombie: 3, bat: 2, giant: 2 } },
    { minCount: 100, interval: 0.45, batch: 3, types: { zombie: 2, bat: 4, giant: 2 } },
    { minCount: 130, interval: 0.4,  batch: 3, types: { zombie: 3, bat: 3, giant: 3 } },
    { minCount: 170, interval: 0.35, batch: 3, types: { zombie: 2, bat: 4, giant: 3 } },
    { minCount: 220, interval: 0.3,  batch: 4, types: { zombie: 3, bat: 3, giant: 4 } },
    { minCount: 280, interval: 0.25, batch: 4, types: { zombie: 2, bat: 4, giant: 4 } },
  ],
  timeLimit: 600,          // 이 시간(초)이 되면 적이 사라지고 사신 등장
  reaper: {
    speed: 60,             // 등장 시 이동 속도
    accel: 15,             // 초마다 속도 증가(결국 따라잡힘)
    radius: 12,
    sizeMul: 2,            // 그릴 때 배율
  },
  xp: {
    // 원작 방식: 2레벨 5, 이후 20레벨까지 +10씩, 40레벨까지 +13씩, 그 뒤 +16씩
    first: 5, step1: 10, step2: 13, step3: 16, tier1: 20, tier2: 40,
    bonusAt20: 100, bonusAt40: 300,  // 원작은 600/2400이지만 10분 게임에 맞춰 축소
    earlyMult: 0.6,        // 초반 성장 가속: earlyUntil 레벨 미만은 필요 경험치 ×0.6
    earlyUntil: 10,
  },
  gems: {
    greenMin: 5,           // 이 값 이상이면 초록 구슬
    redMin: 25,            // 이 값 이상이면 빨강 구슬
    maxCount: 400,         // 이보다 많으면 초과분을 큰 빨강 구슬 하나로 합침
    popSpeed: -60,         // 빨려오기 직전 살짝 튕겨나가는 속도
    attractAccel: 700,
    attractMaxSpeed: 320,
  },
  grid: { cellSize: 32, buckets: 4096 },
  separation: 0.6,         // 적끼리 밀어내는 세기(0~1)
  effects: {
    flashTime: 0.1,        // 피격 시 흰색 번쩍임
    knockbackTime: 0.12,   // 넉백되는 동안 추적 멈춤
    numberTime: 0.6,       // 데미지 숫자 표시 시간
    maxNumbers: 150,
  },
  audio: {
    master: 0.6,
    sfx: 0.5,
    music: 0.32,
    bpm: 140,
  },
  debug: {
    enabled: true,         // 배포할 때 false로
    spawnKey: 'KeyB',      // 적 spawnCount마리 즉시 소환(상한 무시)
    spawnCount: 500,
    reaperKey: 'KeyR',     // 시간을 제한시간으로 건너뛰어 사신 즉시 등장
    statsKey: 'KeyF',      // FPS·프레임 시간·개체 수 표시
  },
};

// =====================================================================
// 스프라이트: 문자 배열 + 팔레트. '.'은 투명
// =====================================================================
const SPRITES = {
  // 고딕 호러풍: 어두운 성 바닥 위에서 보이도록 밝은 면(하이라이트)을 한 줄씩 넣음. 모두 오른쪽을 봄
  player: {
    // 은발, 붉은 눈, 금장 코트에 안감이 붉은 망토를 두른 사냥꾼
    pal: { k: '#0c0814', H: '#e8e4f0', h: '#9890b0', s: '#f2d6c0', S: '#c09888', e: '#d02030',
           c: '#1e1a3a', C: '#3e3870', g: '#d8b048', w: '#f0ecf8', r: '#7a0e1c', R: '#c02838', b: '#3a2418' },
    frames: [[
      '................',
      '.....kkkkk......',
      '....kHHHHHk.....',

// 스프라이트 생성
// =====================================================================
function parseColor(hex) {
  const v = hex.slice(1);
  return [
    parseInt(v.slice(0, 2), 16), parseInt(v.slice(2, 4), 16), parseInt(v.slice(4, 6), 16),
    v.length >= 8 ? parseInt(v.slice(6, 8), 16) : 255,
  ];
}

function rowsToCanvas(rows, pal, mode) {
  const h = rows.length;
  const w = Math.max(...rows.map(r => r.length));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  const img = g.createImageData(w, h);
  const cache = {};
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const ch = rows[y][x] || '.';
      if (ch === '.' || !pal[ch]) continue;
      const col = cache[ch] || (cache[ch] = parseColor(pal[ch]));
      const sx = mode.flip ? w - 1 - x : x;
      const i = (y * w + sx) * 4;
      if (mode.white) { img.data[i] = img.data[i + 1] = img.data[i + 2] = 255; }
      else { img.data[i] = col[0]; img.data[i + 1] = col[1]; img.data[i + 2] = col[2]; }
      img.data[i + 3] = col[3];
    }
  }
  g.putImageData(img, 0, 0);
  return c;
}

function buildSprite(frames, pal) {
  const s = { w: 0, h: 0, normal: [], flip: [], white: [], whiteFlip: [] };
  for (const rows of frames) {
    s.normal.push(rowsToCanvas(rows, pal, {}));
    s.flip.push(rowsToCanvas(rows, pal, { flip: true }));
    s.white.push(rowsToCanvas(rows, pal, { white: true }));
    s.whiteFlip.push(rowsToCanvas(rows, pal, { white: true, flip: true }));
  }
  s.w = s.normal[0].width; s.h = s.normal[0].height;
  return s;
}

function buildGroundPattern() {
  const P = GROUND.patternSize;
  const c = document.createElement('canvas');
  c.width = P; c.height = P;
  const g = c.getContext('2d');
  const tile = rowsToCanvas(GROUND.tile, GROUND.pal, {});
  for (let y = 0; y < P; y += tile.height) for (let x = 0; x < P; x += tile.width) g.drawImage(tile, x, y);
  let seed = GROUND.seed;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (const d of GROUND.decorations) {
    const spr = rowsToCanvas(d.rows, d.pal, {});
    for (let i = 0; i < d.count; i++) {
      g.drawImage(spr, Math.floor(rand() * (P - spr.width)), Math.floor(rand() * (P - spr.height)));
    }
  }
  return c;
}

const canvas = document.getElementById('game');

let W = 0, H = 0, DPR = 1, SCALE = 2, OX = 0, OY = 0;

function resize() {
  DPR = window.devicePixelRatio || 1;
  W = Math.max(1, Math.floor(window.innerWidth * DPR));
  H = Math.max(1, Math.floor(window.innerHeight * DPR));
  canvas.width = W; canvas.height = H;
  SCALE = Math.max(1, Math.min(Math.floor(H / CONFIG.view.targetHeight), Math.floor(W / CONFIG.view.targetWidth)));
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener('resize', resize);
resize();

// 패시브(모든 무기·플레이어에 적용)
const UPGRADES = [
  { id: 'attackSpeed', name: '공격속도', desc: '모든 무기의 쿨타임이 줄어듭니다',
    value: lv => Math.pow(UP.attackSpeedMult, lv), fmt: v => '쿨타임 ' + Math.round(v * 100) + '%' },
  { id: 'amount', name: '투사체 개수', desc: '모든 무기의 투사체·공격 횟수가 늘어납니다',
    value: lv => UP.amountAdd * lv, fmt: v => '+' + v },
  { id: 'damage', name: '데미지', desc: '모든 무기의 위력이 강해집니다',
    value: lv => 1 + UP.damageAdd * lv, fmt: v => Math.round(v * 100) + '%' },
  { id: 'moveSpeed', name: '이동속도', desc: '더 빠르게 움직입니다',
    value: lv => PL.speed * (1 + UP.moveSpeedAdd * lv), fmt: v => Math.round(v / PL.speed * 100) + '%' },
  { id: 'maxHp', name: '최대체력', desc: '최대 체력이 늘고 늘어난 만큼 회복합니다',
    value: lv => Math.round(PL.maxHp * Math.pow(UP.maxHpMult, lv)), fmt: v => String(v) },
  { id: 'magnet', name: '경험치 흡수 범위', desc: '더 멀리 있는 경험치 구슬을 끌어옵니다',
    value: lv => PL.magnetRadius * (1 + UP.magnetAdd * lv), fmt: v => Math.round(v / PL.magnetRadius * 100) + '%' },
];
const UPG = Object.fromEntries(UPGRADES.map(u => [u.id, u]));

// 진화 전 기본 무기 목록과, 진화 무기 → 원래 무기 / 패시브 → 그 패시브로 진화하는 무기
const BASE_WEAPONS = Object.keys(WEAPONS).filter(id => !WEAPONS[id].evolved);
const EVOLVED_FROM = {}, PASSIVE_FOR = {};
for (const id of BASE_WEAPONS) {
  const ev = WEAPONS[id].evolve;
  if (ev) { EVOLVED_FROM[ev.into] = id; PASSIVE_FOR[ev.passive] = id; }
}
const weaponKind = id => EVOLVED_FROM[id] || id;

// =====================================================================
// 게임 상태
// =====================================================================
let state = 'start';  // start | playing | levelup | paused | gameover
let G = null;
let nextUid = 1;
const enemyPool = [], projPool = [], gemPool = [];

function xpRequired(level) {
  const X = CONFIG.xp;
  if (level <= 1) return X.first;
  let req = X.first
    + X.step1 * (Math.min(level, X.tier1) - 1)
    + X.step2 * Math.max(0, Math.min(level, X.tier2) - X.tier1)
    + X.step3 * Math.max(0, level - X.tier2);
  if (level === X.tier1) req += X.bonusAt20;
  if (level === X.tier2) req += X.bonusAt40;
  if (level < X.earlyUntil) req = Math.max(1, Math.round(req * X.earlyMult));
  return req;
}

function newGame() {
  const recycle = (arr, pool) => { for (const o of arr) pool.push(o); };
  if (G) { recycle(G.enemies, enemyPool); recycle(G.projectiles, projPool); recycle(G.gems, gemPool); }
  G = {
    time: 0, kills: 0, level: 1, xp: 0, xpNext: xpRequired(1), pendingLevels: 0,
    player: { x: 0, y: 0, hp: PL.maxHp, maxHp: PL.maxHp, speed: PL.speed, magnet: PL.magnetRadius,
              invuln: 0, facing: 1, dirX: 1, dirY: 0, frame: 0, animT: 0 },
    weapons: [],
    up: Object.fromEntries(UPGRADES.map(u => [u.id, 0])),
    enemies: [], projectiles: [], gems: [], overflowGem: null, numbers: [],
    zones: [], effects: [], chests: [],
    spawnTimer: 0, nextEliteAt: CONFIG.elite.firstAt, reaper: null, deathReason: null,
  };
  G.weapons.push(newWeapon('orb'));
  applyStats();
}

function newWeapon(id) {
  return { id, def: WEAPONS[id], level: 1, timer: 0.3, burstLeft: 0, burstTimer: 0,
           targets: [], shotIdx: 0, angle: 0, activeT: 0, active: false, items: [], st: null };
}

// 무기 레벨 + 패시브를 반영한 실제 수치
function computeStats(w) {
  const d = w.def;
  const st = { damage: d.damage, cooldown: d.cooldown, amount: d.amount, area: d.area,
               speed: d.speed || 0, duration: d.duration || 0, pierce: d.pierce || 0 };
  if (d.levels) for (let i = 0; i < w.level - 1; i++) for (const k in d.levels[i]) st[k] += d.levels[i][k];
  const u = G.up;
  st.damage *= UPG.damage.value(u.damage);
  if (st.cooldown > 0) st.cooldown = Math.max(CONFIG.minCooldown, st.cooldown * UPG.attackSpeed.value(u.attackSpeed));
  st.amount += UPG.amount.value(u.amount);
  w.st = st;
}

function applyStats() {
  const p = G.player, u = G.up;
  p.speed = UPG.moveSpeed.value(u.moveSpeed);
  p.magnet = UPG.magnet.value(u.magnet);
  const newMax = UPG.maxHp.value(u.maxHp);
  if (newMax > p.maxHp) p.hp += newMax - p.maxHp;
  p.maxHp = newMax;
  p.hp = Math.min(p.hp, p.maxHp);
  for (const w of G.weapons) computeStats(w);
}

function canEvolve(w) {
  const ev = w.def.evolve;
  return !!ev && w.level >= CONFIG.weaponMaxLevel && G.up[ev.passive] >= 1;
}

// =====================================================================
// 입력
// =====================================================================
const keys = new Set();
const MOVE_KEYS = new Set(['KeyW', 'KeyA', 'KeyS', 'KeyD', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);

window.addEventListener('keydown', e => {
  if (MOVE_KEYS.has(e.code)) { e.preventDefault(); keys.add(e.code); }
  if (state === 'gameover') return;               // 다시하기 버튼 외 입력 무시
  if (state === 'start') { if (!e.repeat) startGame(); return; }
  if (e.repeat) return;
  if (e.code === 'KeyM') { Sound.toggleMute(); return; }
  const D = CONFIG.debug;
  if (D.enabled) {
    if (e.code === D.statsKey) { Perf.show = !Perf.show; return; }
    if (state === 'playing' && e.code === D.spawnKey) {
      for (let i = 0; i < D.spawnCount; i++) spawnEnemy(pickType(currentWave().types));
      return;
    }
    if (state === 'playing' && e.code === D.reaperKey) {
      if (!G.reaper) G.time = Math.max(G.time, CONFIG.timeLimit);
      return;
    }
  }
  if (state === 'chest') {
    if (['Enter', 'NumpadEnter', 'Space', 'Digit1', 'Numpad1'].includes(e.code)) { e.preventDefault(); closeChest(); }
    return;
  }
  if (state === 'levelup') {
    const m = /^(?:Digit|Numpad)([1-3])$/.exec(e.code);
    if (m) chooseUpgrade(Number(m[1]) - 1);
    return;
  }
  if (e.code === 'Escape') {
    if (state === 'playing') pauseGame();
    else if (state === 'paused') resumeGame();
  }
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (state === 'playing') pauseGame(); });
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'playing') pauseGame(); });

const $ = id => document.getElementById(id);
$('startScreen').addEventListener('click', () => { if (state === 'start') startGame(); });
$('resumeBtn').addEventListener('click', () => { if (state === 'paused') resumeGame(); });
$('retryBtn').addEventListener('click', () => { if (state === 'gameover') restartGame(); });
$('chestBtn').addEventListener('click', closeChest);

function show(id, on) { $(id).classList.toggle('show', on); }

function startGame() {
  show('startScreen', false);
  state = 'playing';
  Sound.init();
  Music.start();
}
function pauseGame() { state = 'paused'; renderEvoTree(); show('pauseScreen', true); Sound.suspend(); }

// 일시정지 화면의 진화 트리: 무기 + 짝 패시브 → 진화 무기, 현재 진행 상황 표시
function renderEvoTree() {
  const cell = (icon, name, sub, cls = '') =>
    `<div class="evo-cell ${cls}"><img class="icon" src="${ICON_URL[icon]}" alt=""><div><b>${name}</b><small>${sub}</small></div></div>`;
  $('evoTree').innerHTML = BASE_WEAPONS.map(id => {
    const ev = WEAPONS[id].evolve, w = findWeapon(id), plv = G.up[ev.passive];
    const done = !!w && w.id === ev.into, ready = !!w && !done && canEvolve(w);
    const wSub = done ? '진화함' : w ? `Lv ${w.level}/${CONFIG.weaponMaxLevel}` : '미보유';
    const pSub = plv ? `Lv ${plv}/${UP.maxLevel}` : '미보유';
    const rSub = done ? '진화 완료' : ready ? '진화 가능! 보물상자를 여세요' : '';
    return `<div class="evo-row ${done ? 'done' : ready ? 'ready' : ''}">`
      + cell(id, WEAPONS[id].name, wSub, w ? '' : 'off') + '<span class="evo-op">+</span>'
      + cell(ev.passive, UPG[ev.passive].name, pSub, plv ? '' : 'off') + '<span class="evo-op">→</span>'
      + cell(ev.into, WEAPONS[ev.into].name, rSub, 'evo-res' + (done || ready ? '' : ' off')) + '</div>';
  }).join('');
  $('evoRule').textContent = `무기 Lv ${CONFIG.weaponMaxLevel} + 짝 패시브 Lv 1 이상일 때, 엘리트가 떨어뜨린 보물상자를 열면 진화합니다`;
}
function resumeGame() { show('pauseScreen', false); state = 'playing'; $('resumeBtn').blur(); Sound.resume(); }
function restartGame() {
  show('gameOverScreen', false);
  $('retryBtn').blur();
  newGame();
  state = 'playing';
  Sound.init();
  Music.start();
}

// =====================================================================
// 레벨업
// =====================================================================
let currentChoices = [];

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

const findWeapon = id => G.weapons.find(w => weaponKind(w.id) === id);

// 레벨업 후보: 보유 무기 레벨업, 새 무기(빈 칸이 있을 때), 패시브. 서로 겹치지 않게 3개
function buildChoices() {
  const pool = [];
  for (const w of G.weapons) {
    if (!w.def.evolved && w.level < CONFIG.weaponMaxLevel) pool.push({ kind: 'weapon', id: w.id });
  }
  if (G.weapons.length < CONFIG.weaponSlots) {
    for (const id of BASE_WEAPONS) if (!findWeapon(id)) pool.push({ kind: 'new', id });
  }
  for (const u of UPGRADES) if (G.up[u.id] < UP.maxLevel) pool.push({ kind: 'passive', id: u.id });
  const picks = shuffle(pool).slice(0, 3);
  if (picks.length < 3) picks.push({ kind: 'heal', id: 'heal' });
  return picks;
}

const STAT_LABEL = { damage: '데미지', amount: '개수', pierce: '관통' };
function describeLevel(delta, kind) {
  return Object.entries(delta).map(([k, v]) => {
    if (k === 'area') return `범위 +${Math.round(v * 100)}%`;
    if (k === 'cooldown') return `쿨타임 ${v}초`;
    if (k === 'duration') return `지속시간 +${v}초`;
    if (k === 'speed') return kind === 'orbit' ? '회전 속도 증가' : '속도 증가';
    return `${STAT_LABEL[k]} +${v}`;
  }).join(' · ');
}

function evolveHint(baseId) {
  const ev = WEAPONS[baseId].evolve;
  return ev ? `진화: Lv ${CONFIG.weaponMaxLevel} + ${UPG[ev.passive].name} → ${WEAPONS[ev.into].name}` : '';
}

function choiceView(c) {
  if (c.kind === 'new') {
    const d = WEAPONS[c.id];
    return { icon: c.id, name: d.name, lv: 'NEW!', desc: d.desc, hint: evolveHint(c.id) };
  }
  if (c.kind === 'weapon') {
    const w = G.weapons.find(x => x.id === c.id), d = w.def;
    return { icon: c.id, name: d.name, lv: `Lv ${w.level} → ${w.level + 1}`,
             desc: describeLevel(d.levels[w.level - 1], c.id), hint: evolveHint(c.id) };
  }
  if (c.kind === 'passive') {
    const u = UPG[c.id], lv = G.up[c.id], base = PASSIVE_FOR[c.id];
    return { icon: c.id, name: u.name, lv: `Lv ${lv} → ${lv + 1}`,
             desc: `${u.desc} (${u.fmt(u.value(lv))} → ${u.fmt(u.value(lv + 1))})`,
             hint: base ? `진화 재료: ${WEAPONS[base].name}` : '' };
  }
  return { icon: 'heal', name: '체력 회복', lv: '', desc: `체력을 ${UP.healAmount} 회복합니다`, hint: '' };
}

function applyChoice(c) {
  if (c.kind === 'new') G.weapons.push(newWeapon(c.id));
  else if (c.kind === 'weapon') G.weapons.find(x => x.id === c.id).level++;
  else if (c.kind === 'passive') G.up[c.id]++;
  else G.player.hp = Math.min(G.player.maxHp, G.player.hp + UP.healAmount);
  applyStats();
}

function openLevelUp() {
  state = 'levelup';
  currentChoices = buildChoices();
  $('levelUpTitle').textContent = `레벨 업! Lv ${G.level - G.pendingLevels + 1}`;
  const box = $('cards');
  box.innerHTML = '';
  currentChoices.forEach((c, i) => {
    const v = choiceView(c);
    const btn = document.createElement('button');
    btn.className = 'card' + (c.kind === 'new' ? ' new' : '');
    btn.innerHTML = `<span class="key">${i + 1}</span><img class="icon" src="${ICON_URL[v.icon]}" alt="">` +
      `<span><span class="name">${v.name}</span><span class="lv">${v.lv}</span>` +
      `<div class="desc">${v.desc}</div>${v.hint ? `<div class="hint2">${v.hint}</div>` : ''}</span>`;
    btn.addEventListener('click', () => chooseUpgrade(i));
    box.appendChild(btn);
  });
  show('levelUpScreen', true);
  Sound.play('levelup');
}

function chooseUpgrade(i) {
  if (state !== 'levelup' || !currentChoices[i]) return;
  Sound.play('select');
  applyChoice(currentChoices[i]);
  G.pendingLevels--;
  if (G.pendingLevels > 0) { openLevelUp(); return; }
  show('levelUpScreen', false);
  state = 'playing';
}

// =====================================================================
// 보물상자: 진화 가능한 무기가 있으면 진화, 없으면 보유 무기·패시브 하나 레벨업
// =====================================================================
function checkChestPickup() {
  const p = G.player;
  for (let i = 0; i < G.chests.length; i++) {
    const c = G.chests[i];
    if ((c.x - p.x) ** 2 + (c.y - p.y) ** 2 < 14 * 14) {
      G.chests.splice(i, 1);
      openChest();
      return true;
    }
  }
  return false;
}

function openChest() {
  state = 'chest';
  const idx = G.weapons.findIndex(canEvolve);
  let title, icon, name, desc;
  if (idx >= 0) {
    const old = G.weapons[idx], into = old.def.evolve.into;
    const w = newWeapon(into);
    w.level = CONFIG.weaponMaxLevel;
    G.weapons[idx] = w;
    title = '진화!';
    icon = into; name = `${old.def.name} → ${w.def.name}`; desc = w.def.desc;
    Sound.play('evolve');
  } else {
    const opts = [];
    for (const w of G.weapons) if (!w.def.evolved && w.level < CONFIG.weaponMaxLevel) opts.push({ kind: 'weapon', id: w.id });
    for (const u of UPGRADES) if (G.up[u.id] >= 1 && G.up[u.id] < UP.maxLevel) opts.push({ kind: 'passive', id: u.id });
    title = '보물상자';
    if (opts.length) {
      const c = opts[Math.floor(Math.random() * opts.length)];
      const v = choiceView(c);
      applyChoice(c);
      icon = v.icon; name = `${v.name} ${v.lv}`; desc = v.desc;
    } else {
      G.player.hp = G.player.maxHp;
      icon = 'heal'; name = '체력 완전 회복'; desc = '체력이 모두 회복되었습니다';
    }
    Sound.play('chest');
  }
  applyStats();
  $('chestTitle').textContent = title;
  $('chestPanel').className = 'panel' + (idx >= 0 ? ' evo' : '');
  $('chestIcon').src = ICON_URL[icon];
  $('chestName').textContent = name;
  $('chestDesc').textContent = desc;
  show('chestScreen', true);
}

function closeChest() {
  if (state !== 'chest') return;
  show('chestScreen', false);
  $('chestBtn').blur();
  if (G.pendingLevels > 0) openLevelUp();
  else state = 'playing';
}

function addXp(v) {
  G.xp += v;
  while (G.xp >= G.xpNext) {
    G.xp -= G.xpNext;
    G.level++;
    G.xpNext = xpRequired(G.level);
    G.pendingLevels++;
  }
}
