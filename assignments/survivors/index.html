function fmtTime(t) {
  const s = Math.floor(t);
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function gameOver(reason) {
  state = 'gameover';
  keys.clear();
  Music.stop();
  if (reason === 'reaper') {
    $('gameOverTitle').textContent = '생존 성공!';
    $('gameOverSub').textContent = `${Math.round(CONFIG.timeLimit / 60)}분을 버텨냈습니다. 하지만 사신에게서 달아날 수는 없었습니다.`;
    $('gameOverPanel').className = 'panel win';
    Sound.play('victory');
  } else {
    $('gameOverTitle').textContent = '쓰러졌습니다';
    $('gameOverSub').textContent = '밤을 끝까지 버티지 못했습니다.';
    $('gameOverPanel').className = 'panel dead';
    Sound.play('gameover');
  }
  $('resTime').textContent = fmtTime(G.time);
  $('resLevel').textContent = G.level;
  $('resKills').textContent = G.kills;
  const btn = $('retryBtn');
  btn.disabled = true;  // 이동 중 실수로 누르는 것 방지
  show('gameOverScreen', true);
  setTimeout(() => { btn.disabled = false; btn.focus(); }, 700);
}

// =====================================================================
// 공간 해시 격자 (적 충돌 검사용)
// =====================================================================
const GRID = {
  size: CONFIG.grid.cellSize,
  mask: CONFIG.grid.buckets - 1,
  head: new Int32Array(CONFIG.grid.buckets),
  next: new Int32Array(8192),
};
const cellHash = (cx, cy) => (Math.imul(cx, 73856093) ^ Math.imul(cy, 19349663)) & GRID.mask;

function buildGrid() {
  const es = G.enemies;
  if (GRID.next.length < es.length) GRID.next = new Int32Array(es.length * 2);
  GRID.head.fill(-1);
  for (let i = 0; i < es.length; i++) {
    const e = es[i];
    const h = cellHash(Math.floor(e.x / GRID.size), Math.floor(e.y / GRID.size));
    GRID.next[i] = GRID.head[h];
    GRID.head[h] = i;
  }
}

// (x, y) 주변 3×3 칸의 적마다 fn(적, 인덱스) 호출. fn이 true를 반환하면 중단
function forNearby(x, y, fn) {
  const cx = Math.floor(x / GRID.size), cy = Math.floor(y / GRID.size);
  const es = G.enemies;
  for (let dy = -1; dy <= 1; dy++) {
    for (let dx = -1; dx <= 1; dx++) {
      for (let j = GRID.head[cellHash(cx + dx, cy + dy)]; j !== -1; j = GRID.next[j]) {
        if (fn(es[j], j)) return;
      }
    }
  }
}

// =====================================================================
// 스폰
// =====================================================================
function randomOffscreenPoint() {
  const hw = viewHalfW() + CONFIG.spawn.margin, hh = viewHalfH() + CONFIG.spawn.margin;
  let t = Math.random() * (4 * hw + 4 * hh);
  let x, y;
  if (t < 2 * hw) { x = -hw + t; y = -hh; }
  else if ((t -= 2 * hw) < 2 * hh) { x = hw; y = -hh + t; }
  else if ((t -= 2 * hh) < 2 * hw) { x = hw - t; y = hh; }
  else { t -= 2 * hw; x = -hw; y = hh - t; }
  return { x: G.player.x + x, y: G.player.y + y };
}

function spawnEnemy(type, elite) {
  const def = CONFIG.enemies[type];
  const pos = randomOffscreenPoint();
  const hpMult = 1 + CONFIG.spawn.hpPerMin * (G.time / 60);
  const e = enemyPool.pop() || {};
  e.uid = nextUid++; e.type = type; e.spr = SPR[type];
  e.x = pos.x; e.y = pos.y;
  e.hp = def.hp * hpMult; e.speed = def.speed; e.damage = def.damage; e.r = def.radius;
  e.xp = Math.round(def.xp * (1 + CONFIG.spawn.xpPerMin * (G.time / 60)));
  e.kbMult = def.kb; e.wobble = def.wobble; e.phase = Math.random() * Math.PI * 2;
  e.animInterval = def.animInterval; e.animT = Math.random() * def.animInterval; e.frame = 0;
  e.facing = 1; e.dead = false; e.flash = 0; e.kbT = 0; e.kx = 0; e.ky = 0; e.orbHit = -99; e.q = 0;
  e.elite = !!elite; e.mul = 1;
  if (elite) {
    const E = CONFIG.elite;
    e.hp *= E.hpMult; e.damage *= E.damageMult; e.speed *= E.speedMult; e.r *= E.sizeMul;
    e.mul = E.sizeMul; e.kbMult = 0.1; e.xp *= E.xpMult;
  }
  e.maxHp = e.hp;
  G.enemies.push(e);
}

function pickType(types) {
  let total = 0;
  for (const k in types) total += types[k];
  let r = Math.random() * total;
  for (const k in types) if ((r -= types[k]) < 0) return k;
  return Object.keys(types)[0];
}

function currentWave() {
  const waves = CONFIG.waves;
  return waves[Math.min(waves.length - 1, Math.floor(G.time / 60))];
}

function updateSpawning(dt) {
  if (G.reaper) return;
  const wave = currentWave();
  let need = 0;
  if (G.enemies.length < wave.minCount) need = wave.minCount - G.enemies.length;
  G.spawnTimer -= dt;
  if (G.spawnTimer <= 0) {
    G.spawnTimer += wave.interval;
    need += wave.batch;
  }
  need = Math.min(need, CONFIG.spawn.maxEnemies - G.enemies.length);
  for (let i = 0; i < need; i++) spawnEnemy(pickType(wave.types));
  if (G.time >= G.nextEliteAt) {
    G.nextEliteAt += CONFIG.elite.interval;
    spawnEnemy(pickType(wave.types), true);
  }
}

// =====================================================================
// 사신 (제한시간 도달 시)
// =====================================================================
function summonReaper() {
  for (const e of G.enemies) e.dead = true;  // 처치로 세지 않고 모두 제거
  G.projectiles.forEach(pr => { pr.dead = true; });
  const pos = randomOffscreenPoint();
  G.reaper = { x: pos.x, y: pos.y, speed: CONFIG.reaper.speed, frame: 0, animT: 0, t: 0, facing: 1 };
  Sound.play('reaper');
}

function updateReaper(dt) {
  const r = G.reaper, p = G.player, C = CONFIG.reaper;
  r.t += dt;
  r.speed = C.speed + C.accel * r.t;
  const dx = p.x - r.x, dy = p.y - r.y, d = Math.hypot(dx, dy);
  if (d > 0.01) { r.x += dx / d * r.speed * dt; r.y += dy / d * r.speed * dt; }
  r.facing = dx < 0 ? -1 : 1;
  r.animT += dt;
  if (r.animT >= 0.25) { r.animT -= 0.25; r.frame ^= 1; }
  if (d < C.radius + PL.hitRadius) {
    p.hp = 0;            // 무적 시간과 관계없이 즉사
    G.deathReason = 'reaper';
  }
}

// =====================================================================
// 업데이트
// =====================================================================
function updatePlayer(dt) {
  const p = G.player;
  const ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const iy = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
  if (ix || iy) {
    const len = Math.hypot(ix, iy);
    p.x += ix / len * p.speed * dt;
    p.y += iy / len * p.speed * dt;
    p.dirX = ix / len; p.dirY = iy / len;
    if (ix) p.facing = ix;
    p.animT += dt;
    if (p.animT >= PL.animInterval) { p.animT -= PL.animInterval; p.frame ^= 1; }
  } else {
    p.frame = 0; p.animT = 0;
  }
  if (p.invuln > 0) p.invuln -= dt;
}

function updateEnemies(dt) {
  const p = G.player;
  const limX = viewHalfW() * CONFIG.spawn.relocateFactor, limY = viewHalfH() * CONFIG.spawn.relocateFactor;
  for (const e of G.enemies) {
    const dx = p.x - e.x, dy = p.y - e.y;
    if (Math.abs(dx) > limX || Math.abs(dy) > limY) {
      const pos = randomOffscreenPoint();
      e.x = pos.x; e.y = pos.y;
      continue;
    }
    if (e.flash > 0) e.flash -= dt;
    if (e.kbT > 0) {
      // 넉백 중에는 추적하지 않고 밀려남
      e.kbT -= dt;
      e.x += e.kx * dt; e.y += e.ky * dt;
    } else {
      const d = Math.hypot(dx, dy);
      if (d > 0.01) {
        let vx = dx / d, vy = dy / d;
        if (e.wobble) {
          const w = Math.sin(G.time * 6 + e.phase) * e.wobble;
          vx -= dy / d * w; vy += dx / d * w;
        }
        e.x += vx * e.speed * dt;
        e.y += vy * e.speed * dt;
      }
    }
    e.facing = dx < 0 ? -1 : 1;
    e.animT += dt;
    if (e.animT >= e.animInterval) { e.animT -= e.animInterval; e.frame ^= 1; }
  }
}

function separateEnemies() {
  const es = G.enemies, k = CONFIG.separation * 0.5;
  for (let i = 0; i < es.length; i++) {
    const a = es[i];
    forNearby(a.x, a.y, (b, j) => {
      if (j <= i) return false;
      let dx = b.x - a.x, dy = b.y - a.y;
      const rr = a.r + b.r;
      const d2 = dx * dx + dy * dy;
      if (d2 >= rr * rr) return false;
      if (d2 < 1e-6) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; }
      const d = Math.sqrt(dx * dx + dy * dy);
      const push = (rr - d) / d * k;
      a.x -= dx * push; a.y -= dy * push;
      b.x += dx * push; b.y += dy * push;
      return false;
    });
  }
}

function nearestEnemies(k) {
  const p = G.player, range2 = CONFIG.targetRange * CONFIG.targetRange;
  const best = [];  // {e, uid, d2}를 거리 오름차순으로 최대 k개
  for (const e of G.enemies) {
    if (e.dead) continue;
    const dx = e.x - p.x, dy = e.y - p.y, d2 = dx * dx + dy * dy;
    if (d2 > range2) continue;
    if (best.length === k && d2 >= best[k - 1].d2) continue;
    let i = best.length < k ? best.length : k - 1;
    while (i > 0 && best[i - 1].d2 > d2) { if (i < k) best[i] = best[i - 1]; i--; }
    best[i] = { e, uid: e.uid, d2 };
  }
  return best;
}

// 사각 영역과 겹칠 수 있는 적마다 fn 호출 (한 번의 검색에서 같은 적은 한 번만)
let queryStamp = 0;
function forArea(x0, y0, x1, y1, fn) {
  const s = GRID.size, es = G.enemies, stamp = ++queryStamp, m = 20;  // m: 가장 큰 적 반지름 여유
  const cx0 = Math.floor((x0 - m) / s), cx1 = Math.floor((x1 + m) / s);
  const cy0 = Math.floor((y0 - m) / s), cy1 = Math.floor((y1 + m) / s);
  for (let cy = cy0; cy <= cy1; cy++) {
    for (let cx = cx0; cx <= cx1; cx++) {
      for (let j = GRID.head[cellHash(cx, cy)]; j !== -1; j = GRID.next[j]) {
        const e = es[j];
        if (e.q === stamp || e.dead) continue;
        e.q = stamp;
        fn(e);
      }
    }
  }
}

function forCircle(x, y, r, fn) {
  forArea(x - r, y - r, x + r, y + r, e => {
    const dx = e.x - x, dy = e.y - y, rr = r + e.r;
    if (dx * dx + dy * dy <= rr * rr) fn(e);
  });
}

function randomVisibleEnemy() {
  const es = G.enemies, p = G.player, hw = viewHalfW(), hh = viewHalfH();
  for (let tries = 0; tries < 24 && es.length; tries++) {
    const e = es[Math.floor(Math.random() * es.length)];
    if (!e.dead && Math.abs(e.x - p.x) < hw && Math.abs(e.y - p.y) < hh) return e;
  }
  return null;
}

function damageEnemy(e, dmg, dx, dy, kb, w) {
  if (e.dead) return;
  e.hp -= dmg;
  e.flash = CONFIG.effects.flashTime;
  if (kb) {
    const d = Math.hypot(dx, dy) || 1;
    e.kx = dx / d * kb * e.kbMult;
    e.ky = dy / d * kb * e.kbMult;
    e.kbT = CONFIG.effects.knockbackTime;
  }
  addNumber(e.x, e.y - e.r, dmg);
  Sound.play('hit');
  if (e.hp <= 0) {
    killEnemy(e);
    if (w && w.def.healOnKill) G.player.hp = Math.min(G.player.maxHp, G.player.hp + w.def.healOnKill);
  }
}

function spawnProjectile(w, x, y, dx, dy, spr, rotate) {
  const st = w.st, d = Math.hypot(dx, dy) || 1;
  const pr = projPool.pop() || {};
  pr.x = x; pr.y = y;
  pr.vx = dx / d * st.speed; pr.vy = dy / d * st.speed;
  pr.life = st.duration; pr.pierce = st.pierce; pr.damage = st.damage;
  pr.radius = w.def.radius * st.area; pr.kb = w.def.knockback; pr.w = w;
  pr.spr = spr; pr.rot = rotate ? Math.atan2(dy, dx) : null;
  pr.hits = pr.hits || []; pr.hits.length = 0;
  pr.dead = false;
  G.projectiles.push(pr);
}

// 쿨타임마다 amount번 연사. canStart가 false면 대기(조건이 맞는 즉시 발사)
function tickBurst(w, dt, canStart, fire) {
  w.timer -= dt;
  if (w.burstLeft === 0 && w.timer <= 0) {
    if (!canStart()) { w.timer = 0; return; }
    w.burstLeft = Math.max(1, Math.round(w.st.amount));
    w.burstTimer = 0; w.shotIdx = 0;
    w.timer = w.st.cooldown;
  }
  if (w.burstLeft > 0) {
    w.burstTimer -= dt;
    while (w.burstLeft > 0 && w.burstTimer <= 0) {
      fire(w.shotIdx++);
      w.burstLeft--;
      w.burstTimer += w.def.burstDelay || 0;
    }
  }
}

function strike(w, x, y, chain, from) {
  const st = w.st, r = w.def.radius * st.area, p = G.player;
  forCircle(x, y, r, e => damageEnemy(e, st.damage, e.x - x, e.y - y, 0, w));
  // 번개 모양: 위(또는 이전 타격 지점)에서 내려오는 지그재그
  const sx = from ? from.x : x + (Math.random() - 0.5) * 20, sy = from ? from.y : y - viewHalfH() - 20;
  const pts = [];
  const n = from ? 5 : 9;
  for (let i = 0; i <= n; i++) {
    const t = i / n, j = i === 0 || i === n ? 0 : (Math.random() - 0.5) * 14;
    pts.push(sx + (x - sx) * t + j, sy + (y - sy) * t);
  }
  G.effects.push({ type: 'bolt', x, y, r, pts, t: 0, life: 0.2, evo: !!w.def.evolved });
  if (chain > 0) {
    const R = w.def.chainRange, cands = [];
    forCircle(x, y, R, e => {
      const d2 = (e.x - x) ** 2 + (e.y - y) ** 2;
      if (d2 > r * r) cands.push([d2, e]);
    });
    cands.sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < Math.min(chain, cands.length); i++) {
      const e = cands[i][1];
      strike(w, e.x, e.y, 0, { x, y });
    }
  }
}

const WEAPON_LOGIC = {
  orb(w, dt) {
    const p = G.player;
    tickBurst(w, dt, () => {
      w.targets = nearestEnemies(Math.max(1, Math.round(w.st.amount)));
      return w.targets.length > 0;
    }, i => {
      let t = w.targets[i % w.targets.length];
      if (!t || t.e.dead || t.e.uid !== t.uid) t = nearestEnemies(1)[0];
      const dx = t ? t.e.x - p.x : p.facing, dy = t ? t.e.y - p.y : 0;
      spawnProjectile(w, p.x, p.y, dx, dy, w.def.evolved ? SPR.orbEvo : SPR.projectile, false);
      Sound.play('shoot');
    });
  },

  knife(w, dt) {
    const p = G.player;
    tickBurst(w, dt, () => true, i => {
      const spr = w.def.evolved ? SPR.knifeEvo : SPR.knife;
      const n = w.def.allDirections;
      if (n) {
        for (let k = 0; k < n; k++) {
          const a = k * Math.PI * 2 / n + i * 0.2;
          spawnProjectile(w, p.x, p.y, Math.cos(a), Math.sin(a), spr, true);
        }
      } else {
        const off = (Math.random() - 0.5) * 10;
        spawnProjectile(w, p.x - p.dirY * off, p.y + p.dirX * off, p.dirX, p.dirY, spr, true);
      }
      Sound.play('knife');
    });
  },

  whip(w, dt) {
    const p = G.player;
    tickBurst(w, dt, () => true, i => {
      const st = w.st, def = w.def;
      const side = (i % 2 === 0 ? 1 : -1) * p.facing;
      const ww = def.width * st.area, hh = def.height * st.area;
      const x0 = side > 0 ? p.x + 2 : p.x - 2 - ww;
      const y0 = p.y - 2 - hh / 2 - Math.floor(i / 2) * hh * 0.8;
      forArea(x0, y0, x0 + ww, y0 + hh, e => {
        const nx = Math.max(x0, Math.min(e.x, x0 + ww)), ny = Math.max(y0, Math.min(e.y, y0 + hh));
        if ((e.x - nx) ** 2 + (e.y - ny) ** 2 <= e.r * e.r) damageEnemy(e, st.damage, e.x - p.x, e.y - p.y, def.knockback, w);
      });
      G.effects.push({ type: 'slash', x: x0 + ww / 2, y: y0 + hh / 2, flip: side < 0, t: 0, life: st.duration + 0.05,
                       mul: st.area * def.width / SPR.slash.w, evo: !!def.evolved });
      Sound.play('slash');
    });
  },

  orbit(w, dt) {
    const p = G.player, st = w.st, def = w.def;
    w.angle += st.speed * dt;
    if (st.duration === Infinity) w.active = true;
    else if (w.activeT > 0) { w.activeT -= dt; w.active = w.activeT > 0; }
    else {
      w.active = false;
      w.timer -= dt;
      if (w.timer <= 0) { w.activeT = st.duration; w.timer = st.cooldown; w.active = true; }
    }
    w.items.length = 0;
    if (!w.active) return;
    const n = Math.max(1, Math.round(st.amount)), R = def.orbitRadius * st.area, r = def.radius * st.area;
    for (let k = 0; k < n; k++) {
      const a = w.angle + k * Math.PI * 2 / n;
      const x = p.x + Math.cos(a) * R, y = p.y + Math.sin(a) * R;
      w.items.push(x, y);
      forCircle(x, y, r, e => {
        if (G.time - e.orbHit < def.hitInterval) return;
        e.orbHit = G.time;
        damageEnemy(e, st.damage, e.x - p.x, e.y - p.y, def.knockback, w);
      });
    }
  },

  fire(w, dt) {
    const p = G.player;
    tickBurst(w, dt, () => true, () => {
      const st = w.st, def = w.def, e = randomVisibleEnemy();
      let x, y;
      if (e) { x = e.x; y = e.y; }
      else { const a = Math.random() * Math.PI * 2, d = 30 + Math.random() * 60; x = p.x + Math.cos(a) * d; y = p.y + Math.sin(a) * d; }
      G.zones.push({ x, y, r: def.radius * st.area, t: 0, life: st.duration, tickT: 0, tick: def.tick,
                     damage: st.damage, w, evo: !!def.evolved, seed: Math.random() * 10 });
      Sound.play('fire');
    });
  },

  bolt(w, dt) {
    tickBurst(w, dt, () => G.enemies.length > 0, () => {
      const e = randomVisibleEnemy();
      if (!e) return;
      strike(w, e.x, e.y, w.def.chain || 0, null);
      Sound.play('zap');
    });
  },
};

function updateWeapons(dt) {
  for (const w of G.weapons) WEAPON_LOGIC[weaponKind(w.id)](w, dt);
}

function updateZones(dt) {
  for (const z of G.zones) {
    z.t += dt;
    z.tickT -= dt;
    if (z.tickT <= 0) {
      z.tickT += z.tick;
      forCircle(z.x, z.y, z.r, e => damageEnemy(e, z.damage, 0, 0, 0, z.w));
    }
  }
  G.zones = G.zones.filter(z => z.t < z.life);
}

function updateEffects(dt) {
  for (const f of G.effects) f.t += dt;
  G.effects = G.effects.filter(f => f.t < f.life);
}

function killEnemy(e) {
  e.dead = true;
  G.kills++;
  dropGem(e.x, e.y, e.xp);
  if (e.elite) G.chests.push({ x: e.x, y: e.y });
  Sound.play('kill');
}

// 데미지 숫자: 위로 떠오르며 사라짐. 개수가 넘치면 가장 오래된 것을 재사용
function addNumber(x, y, value) {
  const list = G.numbers, E = CONFIG.effects;
  const n = list.length >= E.maxNumbers ? list.shift() : {};
  n.x = x + (Math.random() - 0.5) * 6; n.y = y; n.t = 0; n.text = String(Math.round(value));
  list.push(n);
}

function updateNumbers(dt) {
  const list = G.numbers, life = CONFIG.effects.numberTime;
  let n = 0;
  for (let i = 0; i < list.length; i++) {
    const o = list[i];
    o.t += dt; o.y -= 20 * dt;
    if (o.t < life) list[n++] = o;
  }
  list.length = n;
}

function updateProjectiles(dt) {
  for (const pr of G.projectiles) {
    pr.x += pr.vx * dt; pr.y += pr.vy * dt;
    pr.life -= dt;
    if (pr.life <= 0) { pr.dead = true; continue; }
    forNearby(pr.x, pr.y, e => {
      if (e.dead || pr.hits.includes(e.uid)) return false;
      const dx = e.x - pr.x, dy = e.y - pr.y, rr = e.r + pr.radius;
      if (dx * dx + dy * dy > rr * rr) return false;
      pr.hits.push(e.uid);
      damageEnemy(e, pr.damage, pr.vx, pr.vy, pr.kb, pr.w);
      if (--pr.pierce <= 0) { pr.dead = true; return true; }
      return false;
    });
  }
}

function checkPlayerContact() {
  const p = G.player;
  if (p.invuln > 0) return;
  let dmg = 0;
  forNearby(p.x, p.y, e => {
    if (e.dead) return false;
    const dx = e.x - p.x, dy = e.y - p.y, rr = e.r + PL.hitRadius;
    if (dx * dx + dy * dy <= rr * rr && e.damage > dmg) dmg = e.damage;
    return false;
  });
  if (dmg > 0) {
    p.hp = Math.max(0, p.hp - dmg);
    p.invuln = PL.invulnTime;
    Sound.play('hurt');
  }
}

function gemColor(v) {
  return v >= CONFIG.gems.redMin ? 'red' : v >= CONFIG.gems.greenMin ? 'green' : 'blue';
}

function dropGem(x, y, value) {
  if (G.gems.length >= CONFIG.gems.maxCount) {
    // 너무 많으면 초과분을 큰 구슬 하나에 모음
    if (G.overflowGem && !G.overflowGem.dead) { G.overflowGem.value += value; return; }
  }
  const g = gemPool.pop() || {};
  g.x = x; g.y = y; g.value = value; g.attract = false; g.speed = 0; g.dead = false;
  g.overflow = G.gems.length >= CONFIG.gems.maxCount;
  if (g.overflow) G.overflowGem = g;
  G.gems.push(g);
}

function updateGems(dt) {
  const p = G.player, C = CONFIG.gems;
  const m2 = p.magnet * p.magnet, pick2 = PL.pickupRadius * PL.pickupRadius;
  for (const g of G.gems) {
    const dx = p.x - g.x, dy = p.y - g.y, d2 = dx * dx + dy * dy;
    if (!g.attract && d2 < m2) { g.attract = true; g.speed = C.popSpeed; }
    if (!g.attract) continue;
    if (d2 < pick2) {
      g.dead = true;
      if (g === G.overflowGem) G.overflowGem = null;
      addXp(g.value);
      Sound.play('gem');
      continue;
    }
    g.speed = Math.min(C.attractMaxSpeed, g.speed + C.attractAccel * dt);
    const d = Math.sqrt(d2);
    const step = Math.min(g.speed * dt, d);
    g.x += dx / d * step; g.y += dy / d * step;
  }
}

function compact(arr, pool) {
  let n = 0;
  for (let i = 0; i < arr.length; i++) {
    const o = arr[i];
    if (o.dead) pool.push(o); else arr[n++] = o;
  }
  arr.length = n;
}

function update(dt) {
  G.time += dt;
  if (!G.reaper && G.time >= CONFIG.timeLimit) summonReaper();
  updatePlayer(dt);
  updateSpawning(dt);
  updateEnemies(dt);
  if (G.reaper) updateReaper(dt);
  buildGrid();
  separateEnemies();
  updateWeapons(dt);
  updateProjectiles(dt);
  updateZones(dt);
  updateEffects(dt);
  checkPlayerContact();
  updateGems(dt);
  updateNumbers(dt);
  compact(G.enemies, enemyPool);
  compact(G.projectiles, projPool);
  compact(G.gems, gemPool);
  if (G.player.hp <= 0) { gameOver(G.deathReason || 'hp'); return; }
  if (checkChestPickup()) return;
  if (G.pendingLevels > 0) openLevelUp();
}

// =====================================================================
// 그리기
// =====================================================================
function drawSprite(spr, frame, wx, wy, flip, white, mul = 1) {
  const set = white ? (flip ? spr.whiteFlip : spr.white) : (flip ? spr.flip : spr.normal);
  const img = set[frame % set.length];
  const dw = spr.w * SCALE * mul, dh = spr.h * SCALE * mul;
  const sx = OX + Math.round(wx * SCALE) - (dw >> 1);
  const sy = OY + Math.round(wy * SCALE) - (dh >> 1);
  if (sx > W || sy > H || sx + dw < 0 || sy + dh < 0) return;
  ctx.drawImage(img, sx, sy, dw, dh);
}

function drawGround() {
  const P = GROUND.patternSize, PS = P * SCALE, p = G.player;
  const i0 = Math.floor((p.x - viewHalfW()) / P), j0 = Math.floor((p.y - viewHalfH()) / P);
  for (let j = j0; OY + j * PS < H; j++) {
    for (let i = i0; OX + i * PS < W; i++) {
      ctx.drawImage(GROUND_PATTERN, OX + i * PS, OY + j * PS, PS, PS);
    }
  }
}

function drawHud() {
  const u = DPR, p = G.player;
  // 경험치 바
  const barH = Math.round(16 * u);
  ctx.fillStyle = '#0c0a14';
  ctx.fillRect(0, 0, W, barH + 2 * u);
  ctx.fillStyle = '#2a3a8a';
  ctx.fillRect(2 * u, 2 * u, (W - 4 * u) * Math.min(1, G.xp / G.xpNext), barH - 2 * u);
  ctx.fillStyle = '#6a9aff';
  ctx.fillRect(2 * u, 2 * u, (W - 4 * u) * Math.min(1, G.xp / G.xpNext), 3 * u);
  ctx.font = `bold ${Math.round(13 * u)}px sans-serif`;
  ctx.textBaseline = 'middle';
  ctx.textAlign = 'right';
  ctx.fillStyle = '#fff';
  ctx.fillText(`Lv ${G.level}`, W - 8 * u, barH / 2 + u);

  // 생존 시간
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.font = `bold ${Math.round(28 * u)}px sans-serif`;
  ctx.lineWidth = 4 * u;
  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#fff';
  const timeText = fmtTime(G.time);
  const tx = W / 2, ty = barH + 8 * u;
  ctx.strokeText(timeText, tx, ty);
  ctx.fillText(timeText, tx, ty);
  // 남은 시간 (시간 오른쪽)
  const half = ctx.measureText(timeText).width / 2;
  ctx.font = `bold ${Math.round(15 * u)}px sans-serif`;
  ctx.textAlign = 'left';
  const rx = tx + half + 12 * u, ry = ty + 8 * u;
  let sub, color;
  if (G.reaper) { sub = '사신 출현!'; color = Math.floor(G.time * 4) % 2 ? '#ff4a3a' : '#ffd0c8'; }
  else {
    const left = Math.max(0, CONFIG.timeLimit - G.time);
    sub = '남은 ' + fmtTime(Math.ceil(left));
    color = left <= 60 ? '#ff8a6a' : '#c9b8e8';
  }
  ctx.strokeText(sub, rx, ry);
  ctx.fillStyle = color;
  ctx.fillText(sub, rx, ry);
  ctx.fillStyle = '#fff';

  // 보유 무기(윗줄)·패시브(아랫줄)
  const ic = Math.max(1, Math.round(3 * u)), slot = 8 * ic + 4 * u, gap = 3 * u;
  const ix0 = 8 * u, iy0 = barH + 8 * u;
  ctx.font = `bold ${Math.round(10 * u)}px sans-serif`;
  ctx.textAlign = 'right';
  ctx.textBaseline = 'bottom';
  ctx.lineWidth = 3 * u;
  const drawSlot = (col, row, id, label, gold) => {
    const x = ix0 + col * (slot + gap), y = iy0 + row * (slot + gap);
    ctx.fillStyle = 'rgba(10, 6, 20, 0.75)';
    ctx.fillRect(x, y, slot, slot);
    ctx.strokeStyle = gold ? '#e8c040' : '#4a3a6a';
    ctx.lineWidth = gold ? 2 * u : 1 * u;
    ctx.strokeRect(x + 0.5, y + 0.5, slot - 1, slot - 1);
    if (!id) return;
    ctx.drawImage(ICON[id], x + 2 * u, y + 2 * u, 8 * ic, 8 * ic);
    if (label) {
      ctx.lineWidth = 3 * u;
      ctx.strokeStyle = '#000';
      ctx.fillStyle = '#fff';
      ctx.strokeText(label, x + slot - 1 * u, y + slot);
      ctx.fillText(label, x + slot - 1 * u, y + slot);
    }
  };
  for (let i = 0; i < CONFIG.weaponSlots; i++) {
    const w = G.weapons[i];
    drawSlot(i, 0, w && w.id, w ? (w.def.evolved ? '★' : String(w.level)) : '', w && (w.def.evolved || canEvolve(w)));
  }
  const owned = UPGRADES.filter(x => G.up[x.id] > 0);
  for (let i = 0; i < UPGRADES.length; i++) {
    const x = owned[i];
    drawSlot(i, 1, x && x.id, x ? String(G.up[x.id]) : '', false);
  }
  ctx.textBaseline = 'top';
  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#fff';

  if (Sound.muted) {
    ctx.font = `bold ${Math.round(13 * u)}px sans-serif`;
    ctx.textAlign = 'left';
    ctx.lineWidth = 4 * u;
    const my = iy0 + 2 * (slot + gap) + 4 * u;
    ctx.strokeText('음소거 (M)', ix0, my);
    ctx.fillText('음소거 (M)', ix0, my);
  }
  ctx.lineWidth = 4 * u;

  // 처치 수
  const skull = SPR.skull, ss = Math.max(1, Math.round(3 * u));
  ctx.font = `bold ${Math.round(18 * u)}px sans-serif`;
  ctx.textAlign = 'right';
  const kx = W - 10 * u, ky = barH + 10 * u;
  ctx.strokeText(String(G.kills), kx, ky);
  ctx.fillText(String(G.kills), kx, ky);
  const tw = ctx.measureText(String(G.kills)).width;
  ctx.drawImage(skull.normal[0], Math.round(kx - tw - 8 * u - skull.w * ss), Math.round(ky + 2 * u), skull.w * ss, skull.h * ss);
}

function drawNumbers() {
  const list = G.numbers;
  if (!list.length) return;
  const life = CONFIG.effects.numberTime;
  ctx.font = `bold ${7 * SCALE}px monospace`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineWidth = 2 * SCALE;
  ctx.strokeStyle = '#000';
  ctx.fillStyle = '#fff';
  for (const n of list) {
    const x = OX + Math.round(n.x * SCALE), y = OY + Math.round(n.y * SCALE);
    if (x < -50 || y < -50 || x > W + 50 || y > H + 50) continue;
    ctx.globalAlpha = Math.min(1, (life - n.t) / (life * 0.4));
    ctx.strokeText(n.text, x, y);
    ctx.fillText(n.text, x, y);
  }
  ctx.globalAlpha = 1;
}

function drawSpriteRotated(spr, wx, wy, angle) {
  const x = OX + Math.round(wx * SCALE), y = OY + Math.round(wy * SCALE);
  if (x < -40 || y < -40 || x > W + 40 || y > H + 40) return;
  const dw = spr.w * SCALE, dh = spr.h * SCALE;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.drawImage(spr.normal[0], -dw / 2, -dh / 2, dw, dh);
  ctx.restore();
}

function drawEliteBar(e) {
  const bw = 24 * SCALE, bh = 2 * SCALE;
  const x = OX + Math.round(e.x * SCALE) - (bw >> 1);
  const y = OY + Math.round((e.y - e.spr.h * e.mul / 2 - 4) * SCALE);
  if (x > W || y > H || x + bw < 0 || y < 0) return;
  ctx.fillStyle = '#000';
  ctx.fillRect(x - SCALE, y - SCALE, bw + 2 * SCALE, bh + 2 * SCALE);
  ctx.fillStyle = '#e8c040';
  ctx.fillRect(x, y, Math.round(bw * Math.max(0, e.hp) / e.maxHp), bh);
}

function drawZones() {
  for (const z of G.zones) {
    const fade = Math.min(1, (z.life - z.t) / 0.3, z.t / 0.1);
    const x = OX + Math.round(z.x * SCALE), y = OY + Math.round(z.y * SCALE), r = z.r * SCALE;
    if (x + r < 0 || y + r < 0 || x - r > W || y - r > H) continue;
    ctx.globalAlpha = 0.25 * fade;
    ctx.fillStyle = z.evo ? '#ff3010' : '#ff8a20';
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = fade;
    const n = Math.max(4, Math.round(z.r / 4));
    for (let k = 0; k < n; k++) {
      const a = k * 2.39996 + z.seed, d = z.r * 0.85 * Math.sqrt((k + 0.5) / n);
      drawSprite(SPR.flame, Math.floor(z.t * 8 + k), z.x + Math.cos(a) * d, z.y + Math.sin(a) * d, k % 2 === 1, false);
    }
  }
  ctx.globalAlpha = 1;
}

function drawEffects() {
  for (const f of G.effects) {
    const k = 1 - f.t / f.life;
    if (f.type === 'slash') {
      ctx.globalAlpha = Math.min(1, k * 1.5);
      drawSprite(f.evo ? SPR.slashEvo : SPR.slash, 0, f.x, f.y, f.flip, false, f.mul);
    } else if (f.type === 'bolt') {
      ctx.globalAlpha = k;
      ctx.lineJoin = 'miter';
      ctx.beginPath();
      for (let i = 0; i < f.pts.length; i += 2) {
        const x = OX + Math.round(f.pts[i] * SCALE), y = OY + Math.round(f.pts[i + 1] * SCALE);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.strokeStyle = f.evo ? '#6ac8ff' : '#ffe040';
      ctx.lineWidth = 3 * SCALE;
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = SCALE;
      ctx.stroke();
      ctx.fillStyle = f.evo ? '#bfe8ff' : '#fff6b0';
      ctx.globalAlpha = k * 0.5;
      ctx.beginPath();
      ctx.arc(OX + Math.round(f.x * SCALE), OY + Math.round(f.y * SCALE), f.r * SCALE, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

// 화면 밖 보물상자 방향 표시
function drawChestPointers() {
  const p = G.player, hw = viewHalfW() - 12, hh = viewHalfH() - 12;
  for (const c of G.chests) {
    const dx = c.x - p.x, dy = c.y - p.y;
    if (Math.abs(dx) < hw + 10 && Math.abs(dy) < hh + 10) continue;
    const s = Math.min(hw / Math.abs(dx || 1e-6), hh / Math.abs(dy || 1e-6));
    if (Math.floor(G.time * 3) % 2) drawSprite(SPR.chest, 0, p.x + dx * s, p.y + dy * s, false, false);
  }
}

function drawPlayerHpBar() {
  const p = G.player;
  const bw = 18 * SCALE, bh = 2 * SCALE;
  const x = OX + Math.round(p.x * SCALE) - (bw >> 1);
  const y = OY + Math.round((p.y + 10) * SCALE);
  ctx.fillStyle = '#000';
  ctx.fillRect(x - SCALE, y - SCALE, bw + 2 * SCALE, bh + 2 * SCALE);
  ctx.fillStyle = '#4a0a0a';
  ctx.fillRect(x, y, bw, bh);
  ctx.fillStyle = '#e83a3a';
  ctx.fillRect(x, y, Math.round(bw * p.hp / p.maxHp), bh);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingEnabled = false;
  const p = G.player;
  OX = Math.round(W / 2 - p.x * SCALE);
  OY = Math.round(H / 2 - p.y * SCALE);

  drawGround();

  drawZones();
  for (const g of G.gems) drawSprite(SPR.gem[g.overflow ? 'red' : gemColor(g.value)], 0, g.x, g.y, false, false);
  for (const c of G.chests) drawSprite(SPR.chest, 0, c.x, c.y + Math.sin(G.time * 4) * 1.5, false, false);

  for (const e of G.enemies) drawSprite(SPR.shadow, 0, e.x, e.y + e.spr.h * e.mul / 2 - 1, false, false, e.mul);
  for (const e of G.enemies) drawSprite(e.spr, e.frame, e.x, e.y, e.facing < 0, e.flash > 0, e.mul);
  for (const e of G.enemies) if (e.elite) drawEliteBar(e);

  drawSprite(SPR.shadow, 0, p.x, p.y + 7, false, false);
  const blink = p.invuln > 0 && Math.floor(p.invuln / 0.06) % 2 === 0;
  if (!blink) drawSprite(SPR.player, p.frame, p.x, p.y, p.facing < 0, false);
  drawPlayerHpBar();

  for (const pr of G.projectiles) {
    if (pr.rot === null) drawSprite(pr.spr, 0, pr.x, pr.y, false, false);
    else drawSpriteRotated(pr.spr, pr.x, pr.y, pr.rot);
  }
  for (const w of G.weapons) {
    if (!w.items.length) continue;
    const spr = w.def.evolved ? SPR.charmEvo : SPR.charm, m = w.st.area;
    for (let i = 0; i < w.items.length; i += 2) drawSprite(spr, 0, w.items[i], w.items[i + 1], false, false, m);
  }
  drawEffects();
  drawChestPointers();

  const r = G.reaper;
  if (r) {
    const m = CONFIG.reaper.sizeMul;
    drawSprite(SPR.shadow, 0, r.x, r.y + SPR.reaper.h * m / 2, false, false, m);
    drawSprite(SPR.reaper, r.frame, r.x, r.y + Math.sin(r.t * 4) * 2, r.facing < 0, false, m);
  }

  drawNumbers();
  drawHud();
}

// =====================================================================
// 사운드: Web Audio로 직접 합성 (외부 파일 없음)
// =====================================================================
const NOTE_INDEX = { C: 0, 'C#': 1, D: 2, 'D#': 3, E: 4, F: 5, 'F#': 6, G: 7, 'G#': 8, A: 9, Bb: 10, B: 11 };
function noteFreq(name) {
  const m = /^([A-G](?:#|b)?)(\d)$/.exec(name);
  const midi = NOTE_INDEX[m[1]] + (Number(m[2]) + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

const Sound = {
  ctx: null, master: null, sfxBus: null, musicBus: null, noiseBuf: null, pulse: null,
  muted: false, last: {}, gemCombo: 0, gemLast: 0,

  init() {
    if (this.ctx) { this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = this.ctx = new AC();
    const A = CONFIG.audio;
    const comp = ctx.createDynamicsCompressor();
    comp.connect(ctx.destination);
    this.master = ctx.createGain();
    this.master.gain.value = this.muted ? 0 : A.master;
    this.master.connect(comp);
    this.sfxBus = ctx.createGain();
    this.sfxBus.gain.value = A.sfx;
    this.sfxBus.connect(this.master);
    // 음악은 살짝 어둡게 깎아서 고전 게임기 느낌
    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 12000;
    lp.connect(this.master);
    this.musicBus = ctx.createGain();
    this.musicBus.gain.value = A.music;
    this.musicBus.connect(lp);
    // 노이즈 버퍼(타격음·드럼용)
    this.noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    // 25% 듀티 펄스파 (8비트 리드 음색)
    const N = 32, re = new Float32Array(N), im = new Float32Array(N);
    for (let n = 1; n < N; n++) re[n] = 2 / (n * Math.PI) * Math.sin(n * Math.PI * 0.25);
    this.pulse = ctx.createPeriodicWave(re, im);
  },
  suspend() { if (this.ctx) this.ctx.suspend(); },
  resume() { if (this.ctx) this.ctx.resume(); },
  toggleMute() {
    this.muted = !this.muted;
    if (this.master) this.master.gain.setTargetAtTime(this.muted ? 0 : CONFIG.audio.master, this.ctx.currentTime, 0.02);
  },

  // 같은 소리가 너무 촘촘히 겹치지 않게
  throttle(name, ms) {
    const now = performance.now();
    if (now - (this.last[name] || 0) < ms) return false;
    this.last[name] = now;
    return true;
  },

  tone({ wave = 'square', freq, to, dur, vol, at, bus, attack = 0.005 }) {
    const ctx = this.ctx, t = at ?? ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    if (wave === 'pulse') o.setPeriodicWave(this.pulse); else o.type = wave;
    o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(bus || this.sfxBus);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise({ dur, vol, at, type = 'bandpass', freq = 2000, q = 1, bus }) {
    const ctx = this.ctx, t = at ?? ctx.currentTime;
    const s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = this.noiseBuf;
    s.loop = true;  // 버퍼(1초)보다 긴 심벌 소리도 끊기지 않게
    f.type = type; f.frequency.value = freq; f.Q.value = q;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(bus || this.sfxBus);
    s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  },

  play(name) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime;
    switch (name) {
      case 'shoot':
        if (!this.throttle(name, 60)) return;
        this.tone({ wave: 'pulse', freq: 1200, to: 500, dur: 0.06, vol: 0.12 });
        break;
      case 'hit':
        if (!this.throttle(name, 45)) return;
        this.noise({ dur: 0.05, vol: 0.35, freq: 1800, q: 0.8 });
        this.tone({ wave: 'square', freq: 260, to: 90, dur: 0.05, vol: 0.08 });
        break;
      case 'kill':
        if (!this.throttle(name, 50)) return;
        this.tone({ wave: 'triangle', freq: 500, to: 70, dur: 0.1, vol: 0.18 });
        break;
      case 'gem': {
        if (!this.throttle(name, 30)) return;
        const now = performance.now();
        this.gemCombo = now - this.gemLast < 400 ? Math.min(this.gemCombo + 1, 24) : 0;
        this.gemLast = now;
        const f = 1046 * Math.pow(2, this.gemCombo / 24);
        this.tone({ wave: 'triangle', freq: f, dur: 0.09, vol: 0.18 });
        this.tone({ wave: 'sine', freq: f * 2, dur: 0.06, vol: 0.06 });
        break;
      }
      case 'levelup':
        ['C5', 'E5', 'G5', 'C6', 'E6', 'G6'].forEach((n, i) =>
          this.tone({ wave: 'pulse', freq: noteFreq(n), dur: i === 5 ? 0.4 : 0.1, vol: 0.14, at: t + i * 0.06 }));
        break;
      case 'select':
        this.tone({ wave: 'square', freq: 660, dur: 0.05, vol: 0.1 });
        this.tone({ wave: 'square', freq: 990, dur: 0.08, vol: 0.1, at: t + 0.05 });
        break;
      case 'slash':
        if (!this.throttle(name, 80)) return;
        this.noise({ dur: 0.12, vol: 0.3, type: 'bandpass', freq: 3000, q: 0.6 });
        this.tone({ wave: 'sawtooth', freq: 900, to: 200, dur: 0.1, vol: 0.05 });
        break;
      case 'knife':
        if (!this.throttle(name, 50)) return;
        this.tone({ wave: 'pulse', freq: 2200, to: 1400, dur: 0.04, vol: 0.07 });
        break;
      case 'zap':
        if (!this.throttle(name, 60)) return;
        this.noise({ dur: 0.25, vol: 0.4, type: 'highpass', freq: 1500 });
        this.tone({ wave: 'sawtooth', freq: 120, to: 40, dur: 0.25, vol: 0.18 });
        break;
      case 'fire':
        if (!this.throttle(name, 80)) return;
        this.noise({ dur: 0.35, vol: 0.3, type: 'lowpass', freq: 700 });
        this.tone({ wave: 'triangle', freq: 300, to: 120, dur: 0.15, vol: 0.1 });
        break;
      case 'chest':
        ['G4', 'C5', 'E5', 'G5', 'C6'].forEach((n, i) =>
          this.tone({ wave: 'pulse', freq: noteFreq(n), dur: i === 4 ? 0.5 : 0.09, vol: 0.14, at: t + i * 0.08 }));
        break;
      case 'evolve':
        ['C5', 'E5', 'G5', 'C6', 'D6', 'E6', 'G6', 'C7'].forEach((n, i) => {
          this.tone({ wave: 'pulse', freq: noteFreq(n), dur: i === 7 ? 0.9 : 0.1, vol: 0.13, at: t + i * 0.07 });
          this.tone({ wave: 'triangle', freq: noteFreq(n) / 2, dur: 0.12, vol: 0.08, at: t + i * 0.07 });
        });
        break;
      case 'hurt':
        this.tone({ wave: 'sawtooth', freq: 320, to: 70, dur: 0.18, vol: 0.2 });
        this.noise({ dur: 0.12, vol: 0.25, type: 'lowpass', freq: 900 });
        break;
      case 'gameover':
        ['G4', 'E4', 'C4', 'G3'].forEach((n, i) =>
          this.tone({ wave: 'pulse', freq: noteFreq(n), dur: i === 3 ? 0.9 : 0.22, vol: 0.16, at: t + i * 0.22 }));
        break;
      case 'victory':
        ['A4', 'C5', 'E5', 'A5'].forEach((n, i) =>
          this.tone({ wave: 'pulse', freq: noteFreq(n), dur: i === 3 ? 1.0 : 0.16, vol: 0.14, at: t + i * 0.14 }));
        break;
      case 'reaper':
        // 낮게 깔리는 불협화음 + 종소리
        this.tone({ wave: 'sawtooth', freq: 55, dur: 2.2, vol: 0.22, attack: 0.4 });
        this.tone({ wave: 'sawtooth', freq: 58.3, dur: 2.2, vol: 0.18, attack: 0.4 });
        this.noise({ dur: 1.6, vol: 0.12, type: 'lowpass', freq: 400 });
        [0, 0.7, 1.4].forEach(d => {
          this.tone({ wave: 'sine', freq: 392, dur: 1.2, vol: 0.2, at: t + d });
          this.tone({ wave: 'sine', freq: 392 * 2.76, dur: 0.6, vol: 0.06, at: t + d });
        });
        break;
    }
  },
};

// =====================================================================
// BGM: 오리지널 곡 「밤의 성」 (라단조, 140 BPM)
// 고딕 바로크 + 메탈: 파이프오르간, 디스토션 기타(갤럽 리프·리드), 베이스, 드럼, 성당 잔향
// 구성: 오르간 푸가 인트로(8마디) → [메인 테마(16마디) → 아르페지오 질주(8마디)] 반복
// =====================================================================
const Music = (() => {
  let ac = null, bus = null, verb = null, gtrIn = null, leadIn = null, organWave = null;
  let timer = null, section = 0, step = 0, nextTime = 0;

  // ---------------- 음색 ----------------
  function setup() {
    if (ac === Sound.ctx) return;
    ac = Sound.ctx;
    bus = Sound.musicBus;
    // 성당 잔향: 지수 감쇠 노이즈로 만든 임펄스 응답
    const conv = ac.createConvolver();
    const len = Math.floor(ac.sampleRate * 2.0), ir = ac.createBuffer(2, len, ac.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5);
    }
    conv.buffer = ir;
    verb = ac.createGain();
    verb.gain.value = 0.3;
    verb.connect(conv);
    conv.connect(bus);
    gtrIn = makeDrive(25, 0.2, 3000, false, 'none');  // 리듬 기타
    leadIn = makeDrive(60, 0.17, 4500, true, '2x');   // 리드 기타
    // 파이프오르간: 8'·4'·2⅔'·2' 스톱을 섞은 배음 구성
    const amps = [0, 1, 0.8, 0.5, 0.45, 0.12, 0.28, 0.05, 0.2, 0.06, 0.1];
    organWave = ac.createPeriodicWave(new Float32Array(amps.length), new Float32Array(amps));
  }

  function makeDrive(amount, outGain, cutoff, toVerb, oversample) {
    const input = ac.createGain();
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 90;
    const shaper = ac.createWaveShaper();
    const n = 1024, curve = new Float32Array(n);
    for (let i = 0; i < n; i++) { const x = i / (n - 1) * 2 - 1; curve[i] = Math.tanh(x * amount) / Math.tanh(amount); }
    shaper.curve = curve; shaper.oversample = oversample;
    const scoop = ac.createBiquadFilter(); scoop.type = 'peaking'; scoop.frequency.value = 750; scoop.Q.value = 1; scoop.gain.value = -5;
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = cutoff; lp.Q.value = 0.7;
    const out = ac.createGain(); out.gain.value = outGain;
    input.connect(hp); hp.connect(shaper); shaper.connect(scoop); scoop.connect(lp); lp.connect(out); out.connect(bus);
    if (toVerb) out.connect(verb);
    return input;
  }

  function env(g, t, vol, attack, hold, release) {
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + attack);
    g.gain.setValueAtTime(vol, t + attack + hold);
    g.gain.linearRampToValueAtTime(0, t + attack + hold + release);
    return t + attack + hold + release;
  }

  function osc(type, f, detune, t, end, dest) {
    const o = ac.createOscillator();
    if (type === 'organ') o.setPeriodicWave(organWave); else o.type = type;
    o.frequency.value = f; o.detune.value = detune;
    o.connect(dest); o.start(t); o.stop(end + 0.02);
    return o;
  }

  // full: 멜로디처럼 두드러지는 음만 두 줄 파이프 + 16' 저음까지 (가벼운 반주는 한 줄)
  function organ(f, t, dur, vol, verbAmt = 1, full = false) {
    const g = ac.createGain();
    const end = env(g, t, vol, 0.03, Math.max(0, dur - 0.03), 0.18);
    osc('organ', f, 0, t, end, g);
    if (full) {
      osc('organ', f, 6, t, end, g);     // 파이프 두 줄이 살짝 어긋난 울림
      osc('sine', f / 2, 0, t, end, g);  // 16' 저음 스톱
    }
    g.connect(bus);
    if (verbAmt) { const s = ac.createGain(); s.gain.value = verbAmt; g.connect(s); s.connect(verb); }
  }

  function powerChord(root, t, dur, vol) {
    const g = ac.createGain();
    const end = env(g, t, vol, 0.004, dur, 0.05);
    // 근음 두 줄 + 5도. 옥타브 배음은 디스토션이 만들어 줌
    osc('sawtooth', root, -8, t, end, g);
    osc('sawtooth', root, 8, t, end, g);
    osc('sawtooth', root * 1.4983, 0, t, end, g);
    g.connect(gtrIn);
  }

  function leadNote(f, t, dur, vol) {
    const g = ac.createGain();
    const end = env(g, t, vol, 0.01, Math.max(0.02, dur - 0.04), 0.1);
    // 길게 끄는 음에는 비브라토가 서서히 걸림
    const lfo = ac.createOscillator(), depth = ac.createGain();
    lfo.frequency.value = 5.8;
    depth.gain.setValueAtTime(0, t);
    depth.gain.linearRampToValueAtTime(dur > 0.3 ? 22 : 0, t + Math.min(0.3, dur));
    lfo.connect(depth);
    for (const [type, det] of [['sawtooth', -6], ['square', 6]]) depth.connect(osc(type, f, det, t, end, g).detune);
    lfo.start(t); lfo.stop(end + 0.02);
    g.connect(leadIn);
  }

  function bassNote(f, t, dur, vol) {
    const g = ac.createGain(), lp = ac.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 650;
    const end = env(g, t, vol, 0.005, dur, 0.05);
    osc('sawtooth', f, 0, t, end, lp);
    lp.connect(g); g.connect(bus);
  }

  const kick = (t, v = 0.6) => { Sound.tone({ wave: 'sine', freq: 160, to: 42, dur: 0.16, vol: v, at: t, bus });
                                 Sound.noise({ dur: 0.02, vol: v * 0.25, type: 'highpass', freq: 2500, at: t, bus }); };
  const snare = (t, v = 0.4) => { Sound.noise({ dur: 0.18, vol: v, freq: 1900, q: 0.6, at: t, bus });
                                  Sound.noise({ dur: 0.3, vol: v * 0.3, freq: 1900, q: 0.6, at: t, bus: verb });
                                  Sound.tone({ wave: 'triangle', freq: 210, to: 150, dur: 0.08, vol: v * 0.5, at: t, bus }); };
  const hat = (t, v = 0.08) => Sound.noise({ dur: 0.035, vol: v, type: 'highpass', freq: 8000, at: t, bus });
  const crash = t => { Sound.noise({ dur: 1.6, vol: 0.22, type: 'highpass', freq: 4500, at: t, bus });
                       Sound.noise({ dur: 1.6, vol: 0.1, type: 'highpass', freq: 4500, at: t, bus: verb }); };
  const timpani = (t, v = 0.45) => Sound.tone({ wave: 'sine', freq: 98, to: 65, dur: 0.6, vol: v, at: t, bus });

  // ---------------- 악보 ----------------
  const TONES = { Dm: ['D', 'F', 'A'], Bb: ['Bb', 'D', 'F'], Gm: ['G', 'Bb', 'D'], A: ['A', 'C#', 'E'], C: ['C', 'E', 'G'], F: ['F', 'A', 'C'] };
  // 근음(oct 옥타브)부터 화음 구성음을 위로 count개 쌓은 주파수
  function chord(name, oct, count = 3) {
    const out = [];
    let prev = 0;
    for (let i = 0; i < count; i++) {
      let f = noteFreq(TONES[name][i % 3] + oct);
      while (f <= prev) f *= 2;
      out.push(f); prev = f;
    }
    return out;
  }
  // 기타·베이스용 낮은 근음 (드롭 D 정도까지)
  const lowRoot = name => { const f = noteFreq(TONES[name][0] + 2); return f < 70 ? f * 2 : f; };

  // [음, 16분음표 길이]
  const INTRO_MEL = [
    // 푸가 주제 (오르간)
    ['D4', 4], ['A4', 4], ['F4', 2], ['E4', 2], ['D4', 2], ['C#4', 2],
    ['D4', 2], ['E4', 2], ['F4', 2], ['G4', 2], ['A4', 4], ['Bb4', 2], ['A4', 2],
    ['G4', 2], ['F4', 2], ['E4', 2], ['G4', 2], ['F4', 2], ['E4', 2], ['D4', 2], ['F4', 2],
    ['E4', 4], ['A3', 4], ['C#4', 4], ['E4', 4],
    // 응답 (한 옥타브 위)
    ['A4', 4], ['D5', 4], ['Bb4', 2], ['A4', 2], ['G4', 2], ['F4', 2],
    ['G4', 2], ['A4', 2], ['Bb4', 2], ['C5', 2], ['D5', 4], ['E5', 2], ['F5', 2],
    ['E5', 2], ['D5', 2], ['C#5', 2], ['E5', 2], ['D5', 2], ['A4', 2], ['F4', 2], ['D4', 2],
    ['C#4', 4], ['E4', 4], ['A4', 8],
  ];
  const INTRO_PEDAL = ['D2', 'D2', 'D2', 'A1', 'D2', 'G1', 'A1', 'A1'];
  const INTRO_CH = ['Dm', 'Dm', 'Gm', 'A', 'Dm', 'Gm', 'A', 'A'];

  const MAIN_CH = ['Dm', 'Bb', 'Gm', 'A', 'Dm', 'Bb', 'C', 'A', 'Dm', 'Bb', 'Gm', 'A', 'Bb', 'C', 'A', 'A'];
  const MAIN_MEL = [
    ['D5', 6], ['E5', 2], ['F5', 4], ['A5', 4],
    ['G5', 4], ['F5', 2], ['E5', 2], ['D5', 4], ['F5', 4],
    ['Bb5', 6], ['A5', 2], ['G5', 4], ['D5', 4],
    ['E5', 4], ['C#5', 4], ['A4', 8],
    ['D5', 2], ['F5', 2], ['A5', 4], ['D6', 4], ['C6', 4],
    ['Bb5', 4], ['A5', 2], ['G5', 2], ['F5', 4], ['D5', 4],
    ['E5', 4], ['G5', 4], ['C6', 4], ['Bb5', 2], ['A5', 2],
    ['A5', 8], ['G5', 2], ['F5', 2], ['E5', 2], ['C#5', 2],
    ['D5', 4], ['A4', 2], ['D5', 2], ['F5', 4], ['E5', 2], ['D5', 2],
    ['F5', 4], ['D5', 2], ['F5', 2], ['Bb5', 4], ['A5', 2], ['G5', 2],
    ['G5', 4], ['Bb5', 2], ['A5', 2], ['G5', 2], ['F5', 2], ['E5', 2], ['D5', 2],
    ['C#5', 4], ['E5', 4], ['A5', 4], ['G5', 4],
    ['F5', 4], ['G5', 2], ['F5', 2], ['D5', 4], ['Bb4', 4],
    ['C5', 4], ['E5', 2], ['G5', 2], ['C6', 8],
    ['Bb5', 4], ['A5', 4], ['G5', 4], ['F5', 4],
    ['E5', 8], ['C#5', 4], ['A4', 4],
  ];
  const GALLOP = 'x.xxx.xxx.xxx.xx';  // 8분 + 16분 둘 (말발굽 리듬)

  const RUN_CH = ['Dm', 'Gm', 'C', 'F', 'Bb', 'Gm', 'A', 'A'];  // 5도권 진행
  const RUN_IDX = [0, 1, 2, 3, 4, 3, 2, 1, 0, 1, 2, 3, 4, 3, 2, 1];
  const RUN_LAST = ['A4', 'Bb4', 'C#5', 'D5', 'E5', 'F5', 'G5', 'A5', 'Bb5', 'A5', 'G5', 'F5', 'E5', 'D5', 'C#5', 'E5'].map(noteFreq);

  function toSteps(list, bars) {
    const arr = new Array(bars * 16).fill(null);
    let p = 0;
    for (const [n, len] of list) { arr[p] = [noteFreq(n), len]; p += len; }
    return arr;
  }
  const SECTIONS = [
    { bars: 8, mel: toSteps(INTRO_MEL, 8) },   // 0: 인트로
    { bars: 16, mel: toSteps(MAIN_MEL, 16) },  // 1: 메인 테마
    { bars: 8 },                               // 2: 아르페지오 질주
  ];
  const NEXT = [1, 2, 1];

  function playStep(sec, s, t, d) {
    const bar = Math.floor(s / 16), b = s % 16, bar16 = d * 16;
    if (sec === 0) {
      // 인트로: 오르간 독주 + 페달 + 낮은 화음, 끝에서 팀파니와 스네어 롤로 고조
      if (b === 0) {
        organ(noteFreq(INTRO_PEDAL[bar]), t, bar16, 0.08, 1, true);
        for (const f of chord(INTRO_CH[bar], 3)) organ(f, t, bar16, 0.03);
      }
      const m = SECTIONS[0].mel[s];
      if (m) organ(m[0], t, m[1] * d * 0.95, 0.08, 1, true);
      if (bar === 6 && b % 8 === 0) timpani(t);
      if (bar === 7) { snare(t, 0.06 + b / 16 * 0.3); if (b % 4 === 0) timpani(t, 0.3 + b / 40); }
    } else if (sec === 1) {
      const ch = MAIN_CH[bar], root = lowRoot(ch);
      if (b === 0) {
        organ(root, t, bar16, 0.05, 0.6, true);
        for (const f of chord(ch, 3)) organ(f, t, bar16, 0.035, 0.6);
        if (bar % 4 === 0) crash(t);
      }
      if (GALLOP[b] === 'x') powerChord(root, t, b === 0 ? d * 2.5 : d * 0.55, b % 4 === 0 ? 0.5 : 0.36);
      if (b % 2 === 0) bassNote(root, t, d * 1.7, 0.16);
      if (b === 0 || b === 3 || b === 8 || b === 11) kick(t);
      if (b === 4 || b === 12) snare(t);
      if (b % 2 === 0) hat(t, b % 4 === 0 ? 0.1 : 0.06);
      const m = SECTIONS[1].mel[s];
      if (m) leadNote(m[0], t, m[1] * d * 0.95, 0.14);
    } else {
      const ch = RUN_CH[bar], root = lowRoot(ch);
      const f = bar === 7 ? RUN_LAST[b] : chord(ch, 4, 5)[RUN_IDX[b]];
      organ(f, t, d * 0.9, 0.065, 0.5);   // 오르간과 기타가 같은 아르페지오를 겹쳐서 질주
      leadNote(f / 2, t, d * 0.9, 0.06);
      if (b === 0) { organ(root, t, bar16, 0.05, 0.5, true); if (bar % 2 === 0) crash(t); }
      powerChord(root, t, d * 0.45, b % 4 === 0 ? 0.45 : 0.28);
      if (b % 2 === 0) { bassNote(root, t, d * 1.7, 0.16); kick(t, 0.5); }
      if (b === 4 || b === 12) snare(t);
      if (b % 4 === 2) hat(t, 0.1);
    }
  }

  function schedule(horizon = ac.currentTime + 0.15) {
    const d = 60 / CONFIG.audio.bpm / 4;
    while (nextTime < horizon) {
      playStep(section, step, nextTime, d);
      nextTime += d;
      if (++step >= SECTIONS[section].bars * 16) { step = 0; section = NEXT[section]; }
    }
  }

  return {
    start() {
      if (!Sound.ctx) return;
      setup();
      this.stop();
      section = 0; step = 0;
      nextTime = ac.currentTime + 0.15;
      timer = setInterval(() => schedule(), 25);
    },
    stop() { if (timer) clearInterval(timer); timer = null; },
    // 오프라인 렌더링 테스트용: 지정 시간까지 미리 예약
    _scheduleUntil(horizon) { schedule(horizon); },
  };
})();

// =====================================================================
// 메인 루프
// =====================================================================
// 성능 측정 (디버그 F 키로 표시)
const Perf = { show: false, frames: 0, time: 0, work: 0, fps: 0, ms: 0 };

function drawPerf() {
  const u = DPR, lines = [
    `FPS ${Perf.fps.toFixed(0)} · 계산+그리기 ${Perf.ms.toFixed(2)}ms`,
    `적 ${G.enemies.length} · 투사체 ${G.projectiles.length} · 구슬 ${G.gems.length} · 장판 ${G.zones.length}`,
  ];
  ctx.font = `bold ${Math.round(13 * u)}px monospace`;
  ctx.textAlign = 'left';
  ctx.textBaseline = 'bottom';
  ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
  ctx.fillRect(0, H - 40 * u, 440 * u, 40 * u);
  ctx.fillStyle = Perf.fps < 50 ? '#ff8a6a' : '#9aff9a';
  lines.forEach((s, i) => ctx.fillText(s, 8 * u, H - (22 - i * 17) * u + 2 * u));
}

let lastTime = performance.now();
function frame(now) {
  const real = (now - lastTime) / 1000;
  let dt = Math.min(CONFIG.loop.maxFrame, real);
  lastTime = now;
  const t0 = performance.now();
  while (dt > 0 && state === 'playing') {
    const s = Math.min(dt, CONFIG.loop.maxStep);
    update(s);
    dt -= s;
  }
  render();
  Perf.work += performance.now() - t0;
  Perf.frames++;
  Perf.time += real;
  if (Perf.time >= 0.5) {
    Perf.fps = Perf.frames / Perf.time;
    Perf.ms = Perf.work / Perf.frames;
    Perf.frames = 0; Perf.time = 0; Perf.work = 0;
  }
  if (Perf.show) drawPerf();
  requestAnimationFrame(frame);
}

if (!CONFIG.debug.enabled) $('debugHint').remove();
newGame();
requestAnimationFrame(frame);
</script>
</body>
